global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: eltrea-bot
    metrics_path: /metrics
    # /metrics закрыт Basic-авторизацией: раньше он отдавался всем и наружу
    # уходили состав источников, объёмы потребности и средние ставки.
    # Логин — WEB_USER, пароль — в файле, который монтируется из ./secrets
    # и в репозиторий не попадает (см. .gitignore).
    basic_auth:
      username: admin
      password_file: /etc/prometheus/web_password
    static_configs:
      - targets: ["app:8000"]

  # Обратный прокси. После закрытия прямого порта 8000 весь трафик идёт через
  # него, и его состояние надо видеть ОТДЕЛЬНО от состояния приложения: иначе
  # «сайт не открывается» отличается от «приложение упало» только звонком
  # пользователя. Полезнее всего здесь caddy_reverse_proxy_upstreams_healthy
  # и распределение кодов ответа: 502 на графике прокси при живом app —
  # это разъехавшаяся docker-сеть, а не отказ приложения.
  #
  # Порт 2020 служебный: в docker-compose.yml он не публикуется, достучаться
  # до него можно только из docker-сети, поэтому Basic здесь не нужен.
  # Пока сервис caddy не поднят (профиль tls выключен), цель показана как
  # down — это ожидаемое состояние до шага 5 выкатки, а не поломка.
  - job_name: caddy
    static_configs:
      - targets: ["caddy:2020"]
