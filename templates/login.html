<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Навигатор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  /* Экран входа по макету navigator/index.html. Отличие от макета —
     проверка пароля на сервере: здесь обычная форма, никакого JS для входа. */
  html, body { margin: 0; padding: 0; background: #0A0F1E; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; color: #E6F2FF; }
  * { box-sizing: border-box; }
  a { color: rgba(255,255,255,.4); text-decoration: none; }
  a:hover { color: #E6F2FF; }
  .authRoot :focus-visible { outline: 2px solid rgba(0,210,255,.75); outline-offset: 3px; border-radius: 8px; }
  .authRoot input::placeholder { color: rgba(230,242,255,.4); }
  @keyframes authFade { from { opacity: 0; } to { opacity: 1; } }
  .liquid-glass {
    background: rgba(255,255,255,0.008); background-blend-mode: luminosity;
    backdrop-filter: blur(40px) saturate(1.3) brightness(1.06);
    -webkit-backdrop-filter: blur(40px) saturate(1.3) brightness(1.06);
    border: none;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.3), inset 0 -1px 1px rgba(255,255,255,0.12), 0 30px 70px rgba(0,0,0,.4);
    position: relative; overflow: hidden;
  }
  .liquid-glass::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px;
    background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .field {
    width: 100%; border: 1px solid rgba(255,255,255,.15); background: transparent;
    border-radius: 9999px; padding: 13px 15px 13px 40px; color: #E6F2FF;
    font-size: 15px; outline: none; transition: border-color .2s;
  }
  .field:focus { border-color: #00d2ff; }
  .field.with-toggle { padding-right: 44px; }
  .fieldLabel { display: block; cursor: pointer; font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,.6); margin-bottom: 7px; }
  .fieldWrap { position: relative; display: flex; align-items: center; }
  .fieldIcon { position: absolute; left: 14px; pointer-events: none; }
  .submit {
    width: 100%; height: 46px; border: 0; border-radius: 9999px; background: #fff; color: #0A0F1E;
    font-size: 14.5px; font-weight: 600; cursor: pointer;
    transition: background .2s, transform .2s, box-shadow .2s;
  }
  .submit:hover { background: #f5f5f5; transform: scale(1.02); box-shadow: 0 8px 24px rgba(255,255,255,.15); }
  .submit:disabled { opacity: .5; cursor: default; transform: none; box-shadow: none; }
  .toggle {
    position: absolute; right: 10px; width: 32px; height: 32px; display: grid; place-items: center;
    border: 0; background: transparent; color: rgba(255,255,255,.5); cursor: pointer;
    border-radius: 9999px; transition: color .2s, background .2s;
  }
  .toggle:hover { color: #fff; background: rgba(255,255,255,.05); }
  .errorBox {
    display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: 12px;
    background: rgba(255,123,107,.1); border: 1px solid rgba(255,123,107,.28);
  }
  .errorDot { width: 6px; height: 6px; margin-top: 6px; flex: none; border-radius: 9999px; background: #FF7B6B; }
  .errorText { font-size: 12.5px; line-height: 1.5; color: #FF7B6B; }
  @media (max-width: 700px) {
    .authRoot input, .authRoot select { font-size: 16px !important; }
    .authRoot button { min-height: 42px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="authRoot" style="min-height:100vh; position:relative; background:#0A0F1E; color:#E6F2FF; padding:clamp(20px,5vw,48px); display:flex; flex-direction:column; align-items:center; justify-content:center; overflow-x:hidden;">

  <div style="position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;">
    <video autoplay loop muted playsinline preload="auto" src="/static/media/navigator-bg.mp4"
           style="width:100%; height:100%; object-fit:cover;"></video>
    <div style="position:absolute; inset:0; background:rgba(0,0,0,.62);"></div>
  </div>

  <div style="position:relative; z-index:1; width:100%; max-width:428px; animation:authFade .5s cubic-bezier(.22,1,.36,1) both;">

    <div style="text-align:center; margin-bottom:26px;">
      <img src="/static/assets/eltera-logo-horizontal.svg" alt="Eltera" style="height:44px; width:auto; display:block; margin:0 auto 14px;">
      <div style="display:inline-flex; align-items:center; gap:7px; height:26px; padding:0 12px; border-radius:9999px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); margin-bottom:14px;">
        <span style="width:6px; height:6px; border-radius:9999px; background:#A4F4FD;"></span>
        <span style="font-size:12px; color:rgba(255,255,255,.7);">Навигатор</span>
      </div>
      <p style="margin:0 auto; max-width:34ch; color:rgba(255,255,255,.6); font-size:15px; line-height:1.55; font-weight:300;">
        Реестр вахтовых позиций: подбор, карточка, текст кандидату
      </p>
    </div>

    <div class="liquid-glass" style="border-radius:16px; padding:24px;">
      <form method="post" action="/login" style="display:flex; flex-direction:column; gap:15px;" autocomplete="on">
        <input type="hidden" name="next" value="{{ next_url }}">

        <div style="display:block;">
          <label class="fieldLabel" for="email">Рабочая почта</label>
          <div class="fieldWrap">
            <svg class="fieldIcon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"></rect><path d="m2 7 10 6 10-6"></path></svg>
            <input class="field" type="email" name="email" id="email" value="{{ email }}"
                   placeholder="you@company.com" autocomplete="username" required autofocus>
          </div>
        </div>

        <div style="display:block;">
          <label class="fieldLabel" for="password">Пароль</label>
          <div class="fieldWrap">
            <svg class="fieldIcon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input class="field with-toggle" type="password" name="password" id="password"
                   placeholder="Пароль" autocomplete="current-password" required>
            <button type="button" class="toggle" id="toggle" aria-label="Показать пароль" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        {% if error %}
        <div class="errorBox" role="alert" aria-live="assertive">
          <span class="errorDot"></span>
          <span class="errorText">{{ error }}</span>
        </div>
        {% endif %}

        <button type="submit" class="submit" {% if blocked %}disabled{% endif %}>Войти в навигатор</button>

        <p style="margin:2px 0 0; font-size:11.5px; line-height:1.55; color:rgba(255,255,255,.4); text-align:center;">
          Единая учётная запись Eltera — те же почта и пароль действуют в кабинете
          с оценками и в CRM Shellix.
        </p>
      </form>
    </div>

  </div>
</div>

<script>
  /* Единственный скрипт на странице: показать или скрыть пароль.
     Сам вход — обычная отправка формы, проверка на сервере. */
  (function () {
    var toggle = document.getElementById('toggle');
    var input = document.getElementById('password');
    if (!toggle || !input) return;
    toggle.addEventListener('click', function () {
      var shown = input.type === 'text';
      input.type = shown ? 'password' : 'text';
      toggle.setAttribute('aria-pressed', String(!shown));
      toggle.setAttribute('aria-label', shown ? 'Показать пароль' : 'Скрыть пароль');
      input.focus();
    });
  })();
</script>
</body>
</html>
