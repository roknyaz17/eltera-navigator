<!doctype html>
<html lang="ru" data-theme="standard">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0F1E">
  <script data-boot="theme">
    /* Тему ставим до первой отрисовки, иначе при загрузке мелькает стандартная. */
    try { var t = localStorage.getItem('navTheme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <title>Навигатор — подбор и нормализация</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ---------------------------- темы оформления ----------------------------
       Все цвета экрана — переменные. Тройки RGB (--ink, --accent…) подставляются
       в rgba(var(--x), альфа): прозрачность у каждого места своя, оттенок — от
       темы. «Стандартная» (:root) — исходные цвета макета один в один.
       --ink    основа полупрозрачных подложек, рамок и приглушённого текста
       --text   основной текст, --hi — заголовки и самый яркий текст
       --pop    сплошная «главная» кнопка и активная вкладка, --pop-ink — текст на ней
       --accent выбранное, ссылки; --ok / --warn / --bad / --na — статусы
       Миниатюры тем в переключателе рисуются из THEMES в скрипте — при правке
       цветов здесь поправьте и их. */
    :root {
      color-scheme: dark;
      --bg-solid: #0A0F1E; --bg: 10,15,30;
      --ink: 255,255,255; --text: 230,242,255; --hi: 255,255,255;
      --pop: 255,255,255; --pop-ink: 10,15,30; --pop-text: 0,0,0;
      --accent: 164,244,253; --accent-2: 22,215,255;
      --ok: 110,231,193; --warn: 217,164,65; --bad: 255,123,107; --bad-line: 248,113,113; --na: 100,116,139;
      --shade: 0,0,0; --deep: 20,30,52; --line: 148,180,230;
      --backdrop: rgba(4,7,14,.66);
      --mine: 94,140,255; --attach: 207,224,255; --bad-soft: 255,156,156; --warn-soft: 255,207,122;
      --badge: 217,79,79; --on-badge: 255,255,255;
      --rim: 255,255,255;
      --glass: rgba(255,255,255,.035); --glass-head: rgba(255,255,255,.035); --glass-dlg: rgba(255,255,255,.035);
      --glass-shadow: inset 0 1px 1px rgba(255,255,255,.14), inset 0 -1px 0 rgba(255,255,255,.06);
      --glass-pop: rgba(var(--bg),.82);
      --video-filter: none; --video-opacity: 1;
      --veil: rgba(0,0,0,.62);
      --logo-filter: none;
    }
    [data-theme="emerald"] {
      --bg-solid: #03130E; --bg: 3,19,14;
      --text: 220,247,235; --pop: 236,253,245; --pop-ink: 2,30,21; --pop-text: 2,30,21;
      --accent: 125,240,196; --accent-2: 45,212,191;
      --ok: 190,242,100; --warn: 236,196,104; --bad: 255,138,122; --bad-line: 255,138,122; --na: 106,134,122;
      --deep: 9,44,32; --line: 134,214,180;
      --backdrop: rgba(1,10,7,.7);
      --mine: 45,212,191; --attach: 204,251,231; --bad-soft: 255,170,160; --warn-soft: 247,221,150; --badge: 214,64,52;
      --rim: 220,255,240;
      --glass: rgba(220,255,240,.04); --glass-head: rgba(220,255,240,.04); --glass-dlg: rgba(220,255,240,.04);
      --glass-shadow: inset 0 1px 1px rgba(220,255,240,.16), inset 0 -1px 0 rgba(220,255,240,.06);
      --video-filter: hue-rotate(-32deg) saturate(1.5) brightness(1.1);
      --veil: radial-gradient(80% 70% at 95% -10%, rgba(16,185,129,.32), transparent 65%),
              radial-gradient(70% 65% at -8% 108%, rgba(132,204,22,.16), transparent 62%),
              linear-gradient(180deg, rgba(4,34,24,.58), rgba(2,20,14,.74));
    }
    [data-theme="amethyst"] {
      --bg-solid: #0D0720; --bg: 13,7,32;
      --text: 236,231,255; --pop: 246,242,255; --pop-ink: 23,10,52; --pop-text: 23,10,52;
      --accent: 199,182,255; --accent-2: 232,121,249;
      --ok: 110,231,183; --warn: 242,196,109; --bad: 251,113,133; --bad-line: 251,113,133; --na: 123,112,155;
      --deep: 34,20,70; --line: 181,160,245;
      --backdrop: rgba(7,3,18,.7);
      --mine: 167,139,250; --attach: 221,214,254; --bad-soft: 253,164,175; --warn-soft: 253,224,150; --badge: 219,39,119;
      --rim: 235,225,255;
      --glass: rgba(235,225,255,.04); --glass-head: rgba(235,225,255,.04); --glass-dlg: rgba(235,225,255,.04);
      --glass-shadow: inset 0 1px 1px rgba(235,225,255,.16), inset 0 -1px 0 rgba(235,225,255,.06);
      --video-filter: hue-rotate(95deg) saturate(1.4) brightness(1.08);
      --veil: radial-gradient(80% 70% at 95% -10%, rgba(139,92,246,.36), transparent 65%),
              radial-gradient(70% 65% at -8% 108%, rgba(217,70,239,.18), transparent 62%),
              linear-gradient(180deg, rgba(26,12,58,.58), rgba(13,6,32,.74));
    }
    [data-theme="sunset"] {
      --bg-solid: #160A06; --bg: 22,10,6;
      --text: 255,236,222; --pop: 255,246,237; --pop-ink: 48,18,6; --pop-text: 48,18,6;
      --accent: 255,188,140; --accent-2: 251,146,60;
      --ok: 134,239,172; --warn: 252,211,77; --bad: 255,107,129; --bad-line: 255,107,129; --na: 145,118,106;
      --deep: 56,24,14; --line: 242,172,140;
      --backdrop: rgba(14,5,2,.7);
      --mine: 251,146,60; --attach: 255,222,200; --bad-soft: 255,170,182; --warn-soft: 253,230,138; --badge: 220,38,38;
      --rim: 255,235,220;
      --glass: rgba(255,235,220,.04); --glass-head: rgba(255,235,220,.04); --glass-dlg: rgba(255,235,220,.04);
      --glass-shadow: inset 0 1px 1px rgba(255,235,220,.16), inset 0 -1px 0 rgba(255,235,220,.06);
      --video-filter: hue-rotate(215deg) saturate(1.6) brightness(1.1);
      --veil: radial-gradient(80% 70% at 95% -10%, rgba(249,115,22,.32), transparent 65%),
              radial-gradient(70% 65% at -8% 108%, rgba(225,29,72,.18), transparent 62%),
              linear-gradient(180deg, rgba(48,20,8,.58), rgba(24,9,4,.74));
    }
    [data-theme="graphite"] {
      --bg-solid: #0B0C0E; --bg: 11,12,14;
      --text: 230,232,235; --pop: 245,245,246; --pop-ink: 11,12,14; --pop-text: 11,12,14;
      --accent: 214,247,150; --accent-2: 163,230,53;
      --ok: 134,239,172; --warn: 232,190,92; --bad: 248,113,113; --bad-line: 248,113,113; --na: 113,113,122;
      --deep: 30,32,36; --line: 161,161,170;
      --backdrop: rgba(3,3,4,.72);
      --mine: 163,230,53; --attach: 228,240,205; --bad-soft: 252,165,165; --warn-soft: 253,224,140; --badge: 220,38,38;
      --video-filter: grayscale(1) brightness(1.2) contrast(1.05);
      --veil: radial-gradient(80% 70% at 95% -10%, rgba(163,230,53,.11), transparent 65%),
              radial-gradient(70% 65% at -8% 108%, rgba(255,255,255,.05), transparent 62%),
              linear-gradient(180deg, rgba(30,32,36,.62), rgba(14,15,17,.76));
    }
    /* Tablio: плоский почти чёрный фон, нейтральные серые из палитры zinc,
       красный акцент. Видеофон гасится — в Tablio его нет, панели лежат на
       ровном фоне, и стекло поверх видео противоречило бы этому языку. */
    [data-theme="tablio"] {
      --bg-solid: #0A0A0A; --bg: 10,10,10;
      --ink: 255,255,255; --text: 250,250,250; --hi: 255,255,255;
      --pop: 255,86,86; --pop-ink: 255,255,255; --pop-text: 255,255,255;
      --accent: 255,86,86; --accent-2: 236,72,153;
      --ok: 74,222,128; --warn: 249,115,22; --bad: 248,113,113; --bad-line: 248,113,113; --na: 82,82,91;
      --shade: 0,0,0; --deep: 39,39,42; --line: 161,161,170;
      --backdrop: rgba(0,0,0,.72);
      --mine: 255,86,86; --attach: 161,161,170; --bad-soft: 252,165,165; --warn-soft: 253,186,116;
      --badge: 255,86,86; --on-badge: 255,255,255;
      --rim: 255,255,255;
      --glass: #0D0D0D; --glass-head: #0D0D0D; --glass-dlg: #0D0D0D;
      --glass-shadow: none;
      --glass-pop: #0D0D0D;
      --video-filter: none; --video-opacity: 0;
      --veil: #0A0A0A;
    }
    [data-theme="light"] {
      color-scheme: light;
      --bg-solid: #EEF2F7; --bg: 241,244,249;
      --ink: 15,23,42; --text: 15,23,42; --hi: 2,6,23;
      --pop: 15,23,42; --pop-ink: 255,255,255; --pop-text: 255,255,255;
      --accent: 37,99,235; --accent-2: 2,132,199;
      --ok: 4,120,87; --warn: 161,98,7; --bad: 220,38,38; --bad-line: 220,38,38; --na: 100,116,139;
      --shade: 148,163,184; --deep: 203,213,225; --line: 100,116,139;
      --backdrop: rgba(15,23,42,.32);
      --mine: 37,99,235; --attach: 29,78,216; --bad-soft: 185,28,28; --warn-soft: 161,98,7; --badge: 220,38,38;
      --rim: 255,255,255;
      --glass: rgba(255,255,255,.62); --glass-head: rgba(255,255,255,.7); --glass-dlg: rgba(255,255,255,.94);
      --glass-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 1px rgba(15,23,42,.07), 0 1px 3px rgba(15,23,42,.05);
      --glass-pop: rgba(255,255,255,.86);
      --video-filter: invert(1) hue-rotate(180deg) saturate(.75);
      --video-opacity: .5;
      --veil: radial-gradient(70% 60% at 92% -6%, rgba(59,130,246,.16), transparent 62%),
              radial-gradient(60% 55% at -4% 104%, rgba(14,165,233,.12), transparent 60%),
              linear-gradient(180deg, rgba(241,245,250,.66), rgba(241,245,250,.8));
      --logo-filter: brightness(0) saturate(100%);
    }
    .navLogo { filter: var(--logo-filter); }
    .navRoot [role="dialog"] > .liquid-glass { background: var(--glass-dlg); }
    /* Выпадающий список рисует сам браузер: без этого в тёмной теме он белый,
       а текст в нём наследует светлый цвет поля. */
    .navRoot option, .navRoot optgroup { background: rgb(var(--bg)); color: rgb(var(--text)); }
    /* Переключатель тем. Стоит вне шапки: у шапки свой backdrop-filter, и
       вложенное стекло размывало бы только её, а не страницу под панелью. */
    .themePop.liquid-glass { position: fixed; z-index: 60; width: 372px; max-width: calc(100vw - 24px); border-radius: 18px; padding: 14px; background: var(--glass-pop); backdrop-filter: blur(26px) saturate(1.2); -webkit-backdrop-filter: blur(26px) saturate(1.2); box-shadow: var(--glass-shadow), 0 24px 60px -20px rgba(0,0,0,.55); }
    .themePopIn { animation: appFade .22s cubic-bezier(.22,1,.36,1) both; }
    .themeTile:hover { background: rgba(var(--ink),.07) !important; }
    .themeTile:hover .themeSwatch { transform: translateY(-1px); }
    .themeSwatch { transition: transform .2s; }
    @media (max-width: 700px) {
      .themePop.liquid-glass { left: 12px !important; right: 12px !important; top: auto !important; bottom: 12px; width: auto; max-height: calc(100dvh - 24px); overflow-y: auto; }
      /* На телефоне вкладки и так занимают всю строку — палитра уходит в угол,
         на уровень логотипа, а текст под логотипом её не наезжает. */
      .navRoot .navHeader { position: relative !important; }
      .navRoot .navHeader > div:first-child { padding-right: 50px; }
      .navRoot [data-theme-btn] { position: absolute; top: 14px; right: 0; }
    }
    /* Помощник подбора: окно справа внизу поверх списка, но под модалками (у
       них z-index 80) — карточка позиции открывается прямо из ответа. Фон
       плотнее, чем у палитры тем: под текстом ответа иначе читаются карточки. */
    .aiPanel.liquid-glass { position: fixed; z-index: 60; right: 24px; bottom: 24px; width: 430px; max-width: calc(100vw - 24px); height: min(660px, calc(100dvh - 110px)); border-radius: 18px; display: flex; flex-direction: column; background: linear-gradient(rgba(var(--shade),.52), rgba(var(--shade),.52)), var(--glass); backdrop-filter: blur(30px) saturate(1.15); -webkit-backdrop-filter: blur(26px) saturate(1.2); box-shadow: var(--glass-shadow), 0 24px 60px -20px rgba(var(--shade),.55); }
    .aiPanelIn { animation: appFade .22s cubic-bezier(.22,1,.36,1) both; }
    .aiFab { position: fixed; z-index: 60; right: 24px; bottom: 24px; box-shadow: 0 14px 34px -12px rgba(var(--shade),.6); }
    .aiFab:hover { transform: translateY(-1px); }
    @keyframes aiDot { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    .aiDots span { display: inline-block; width: 6px; height: 6px; margin-right: 4px; border-radius: 9999px; background: rgba(var(--ink),.6); animation: aiDot 1.2s infinite ease-in-out; }
    .aiDots span:nth-child(2) { animation-delay: .15s; }
    .aiDots span:nth-child(3) { animation-delay: .3s; }
    @media (max-width: 700px) {
      .aiPanel.liquid-glass { left: 12px; right: 12px; bottom: 12px; width: auto; height: calc(100dvh - 24px); }
      .aiFab { right: 14px; bottom: 14px; }
    }
    /* Смена темы раскрывается кругом от выбранной плитки (см. switchTheme). */
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }


    /* ------------------------------------------------------------------
       Общий язык оформления. Экран строился на стекле поверх видео:
       размытие, световой кант по краю карточки, тени. Видео убрано — стекло
       больше не на чем строить, поэтому панели стали плотными во всех темах,
       а темы теперь отличаются только цветом.

       Форма задаётся через !important: скругления, фоны и рамки в Навигаторе
       прописаны в инлайновых style-атрибутах разметки, иначе их не перебить.
       Фон .liquid-glass здесь НЕ трогаем — он берётся из --glass, у диалогов
       и всплывающих окон свои переменные, и !important их бы сломал.
       ------------------------------------------------------------------ */
    .liquid-glass {
      border: 1px solid rgba(var(--ink),.10) !important;
      border-radius: 16px !important;
      box-shadow: none !important;
      backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
      background-blend-mode: normal !important;
    }
    .liquid-glass::before { display: none !important; }
    .aiPanel.liquid-glass { background: var(--glass) !important; }
    .hWhite { border-radius: 10px !important; font-weight: 600 !important; }
    .hLight, .hLightW, .hSoft, .hSoft8, .hSoft8W { border-radius: 10px !important; }
    .fLine { border-radius: 10px !important; background: rgba(var(--ink),.045) !important; border-color: rgba(var(--ink),.14) !important; }
    /* Тумблер остаётся круглым: это не кнопка, у него своя форма. */
    .navSwitch, .navSwitch > span { border-radius: 9999px !important; }

    /* Плотный цвет панели для каждой темы. Посчитан наложением её собственного
       полупрозрачного стекла на её же фон, поэтому оттенок темы сохранился.
       Эти правила идут ПОСЛЕ блоков тем — вес одинаковый, побеждает последний. */
    [data-theme="standard"] { --glass: #131726; --glass-head: #131726; --glass-dlg: #131726; --glass-pop: #131726; }
    [data-theme="emerald"] { --glass: #0C1C17; --glass-head: #0C1C17; --glass-dlg: #0C1C17; --glass-pop: #0C1C17; }
    [data-theme="amethyst"] { --glass: #161029; --glass-head: #161029; --glass-dlg: #161029; --glass-pop: #161029; }
    [data-theme="sunset"] { --glass: #1F130F; --glass-head: #1F130F; --glass-dlg: #1F130F; --glass-pop: #1F130F; }
    [data-theme="graphite"] { --glass: #141516; --glass-head: #141516; --glass-dlg: #141516; --glass-pop: #141516; }
    [data-theme="light"] { --glass: #FFFFFF; --glass-head: #FFFFFF; --glass-dlg: #FFFFFF; --glass-pop: #FFFFFF; }

    html, body { margin: 0; padding: 0; background: var(--bg-solid); }
    body { font-family: 'Onest', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; color: rgb(var(--text)); }
    * { box-sizing: border-box; }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: rgb(var(--accent)); text-decoration: none; }
    a:hover { color: rgb(var(--text)); }
    .liquid-glass { background: var(--glass); background-blend-mode: luminosity; backdrop-filter: blur(18px) saturate(1.1); -webkit-backdrop-filter: blur(18px) saturate(1.1); border: none; box-shadow: var(--glass-shadow); position: relative; overflow: hidden; }
    .liquid-glass::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px; background: linear-gradient(180deg, rgba(var(--rim),.45) 0%, rgba(var(--rim),.15) 20%, rgba(var(--rim),0) 40%, rgba(var(--rim),0) 60%, rgba(var(--rim),.15) 80%, rgba(var(--rim),.45) 100%); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
    @keyframes appFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .appScroll { scrollbar-width: thin; scrollbar-color: rgba(var(--ink),.14) transparent; }
    .appScroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .appScroll::-webkit-scrollbar-thumb { background: rgba(var(--ink),.14); border-radius: 999px; }
    .appScroll::-webkit-scrollbar-track { background: transparent; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

    /* Состояния наведения и фокуса из макета: там они жили атрибутами
       style-hover / style-focus, здесь это классы с теми же значениями. */
    .hLight:hover { background: rgba(var(--ink),.1) !important; }
    .hLightW:hover { background: rgba(var(--ink),.1) !important; color: rgb(var(--hi)) !important; }
    .hSoft:hover { background: rgba(var(--ink),.05) !important; }
    .hSoft8:hover { background: rgba(var(--ink),.08) !important; }
    .hSoft8W:hover { background: rgba(var(--ink),.08) !important; color: rgb(var(--hi)) !important; }
    .hWhite:hover { background: rgba(var(--pop),.9) !important; }
    .hWhite:active { transform: scale(.98); }
    .hGold:hover { background: rgba(var(--warn),.18) !important; }
    .hCyan:hover { background: rgba(var(--accent),.12) !important; border-color: rgba(var(--accent),.45) !important; }
    .hRed:hover { background: rgba(var(--bad),.12) !important; }
    .fLine:focus { border-color: rgba(var(--ink),.4) !important; }

    /* Колонки-скроллы — это flex-column: без этого блоки с overflow:hidden
       (например форма ставок) сжимаются в полоску вместо того, чтобы скроллиться. */
    .appScroll > * { flex: none; }

    /* Мобильные и низкие экраны: колонки перестают быть панелями во всю высоту, скроллит страница */
    @media (max-width: 900px), (max-height: 560px) {
      .navHeader { position: static !important; margin-top: 0 !important; }
      .navAside, .navMain { position: static !important; height: auto !important; min-height: 0 !important; overflow: visible !important; }
      .navAside > section, .navAside > div, .navMain > div { overflow: visible !important; }
      .navAside .appScroll, .navMain .appScroll { max-height: none !important; overflow: visible !important; }
      .navAside .cityList { max-height: 260px !important; overflow-y: auto !important; }
    }
    /* Телефон: палец, читаемость, без зума при фокусе в поле */
    @media (max-width: 700px) {
      .navRoot button, .navRoot select, .navRoot a[target="_blank"] { min-height: 40px; }
      /* Тумблер — не кнопка-таргет: свои пропорции, иначе ручка отрывается от трека */
      .navRoot .navSwitch { min-height: 0 !important; width: 58px !important; height: 32px !important; }
      .navRoot .navSwitch > span { width: 28px !important; height: 28px !important; top: 2px !important; left: 2px !important; }
      .navRoot .navSwitch[aria-pressed="true"] > span { transform: translateX(26px) !important; }
      .navRoot input, .navRoot select, .navRoot textarea { font-size: 16px !important; min-height: 42px; }
      .navRoot [role="dialog"] { padding: 12px !important; align-items: end !important; }
      .navRoot [role="dialog"] > .liquid-glass { max-height: calc(100dvh - 24px) !important; padding: 18px !important; }
      .navRoot [role="dialog"] > .dlgShell { padding: 0 !important; }
      .navRoot [role="dialog"] > .dlgShell > .dlgBody { padding: 18px !important; }
      .navRoot [role="dialog"] > .liquid-glass:not(.dlgShell) > div:last-child,
      .navRoot [role="dialog"] .dlgBody > div:last-child { position: sticky; bottom: -18px; background: rgba(var(--bg),.92); padding: 10px 0 2px; }
    }
  </style>
</head>

/* =============================== утилиты =============================== */

function esc(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function attr(value) { return esc(value); }

/* Ссылки приезжают из источников (source_url заявки, материалы), поэтому в
   href пускаем только веб-схемы: javascript: и data: сюда попасть не должны. */
function safeUrl(value) {
  const url = String(value == null ? '' : value).trim();
  return /^(https?:\/\/|mailto:|tg:\/\/|\/)/i.test(url) ? esc(url) : '';
}

function setState(patch) { Object.assign(S, patch); render(); }

let _toastTimer = null;
function toast(text) {
  S.toast = text;
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { S.toast = ''; render(); }, 2400);
  render();
}

/* Приложение отдаётся по http, а navigator.clipboard существует только в
   защищённом контексте: обращение к .writeText падает TypeError. Раньше это
   исключение глушилось пустым catch — тост «Скопировано» показывался поверх
   пустого буфера, и в мессенджер вставлять было нечего.

   Запасной путь — скрытая textarea и document.execCommand('copy'). Он работает
   только внутри обработчика пользовательского клика, поэтому copyText должен
   вызываться из действия кнопки синхронно, без await и таймеров перед ним.
   Возвращаем промис с честным результатом: тост зависит от него. */
function copyText(text) {
  const value = String(text == null ? '' : text);
  if (!value) return Promise.resolve(false);

  const legacy = () => {
    const ta = document.createElement('textarea');
    ta.value = value;
    // readonly — чтобы на телефоне не выезжала клавиатура; поле не прячем через
    // display:none и не уводим за экран прокруткой: невидимое или отсутствующее
    // в потоке поле не выделяется и execCommand возвращает false.
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed; top:0; left:0; width:1px; height:1px; padding:0; border:none; outline:none; box-shadow:none; background:transparent; opacity:0;';
    document.body.appendChild(ta);
    const sel = window.getSelection ? window.getSelection() : null;
    const prev = sel && sel.rangeCount ? sel.getRangeAt(0) : null;
    let ok = false;
    try {
      ta.focus();
      ta.select();
      if (ta.setSelectionRange) ta.setSelectionRange(0, value.length);  // iOS игнорирует select() на readonly
      ok = document.execCommand('copy');
    } catch (e) { ok = false; }
    document.body.removeChild(ta);
    if (sel && prev) { sel.removeAllRanges(); sel.addRange(prev); }
    return ok;
  };

  if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) {
    // Даже в https запись отваливается, если вкладка не в фокусе или
    // пользователь запретил доступ к буферу, — тогда доигрываем через textarea.
    try { return navigator.clipboard.writeText(value).then(() => true, () => legacy()); }
    catch (e) { return Promise.resolve(legacy()); }
  }
  return Promise.resolve(legacy());
}

/* Буфер может быть закрыт настройками браузера — тогда единственное, что мы
   можем предложить, это выделить текст под Ctrl+C. Выделять нужно после
   toast(): он перерисовывает страницу целиком и убивает старое выделение. */
function selectNode(id) {
  const node = document.getElementById(id);
  if (!node || !window.getSelection || !document.createRange) return false;
  const range = document.createRange();
  range.selectNodeContents(node);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  return true;
}

function spaced(n) {
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

function money(n) {
  return n ? spaced(n) + ' ₽' : '';
}

function need(r) {
  const p = [];
  if (r.m) p.push(r.m + ' муж');
  if (r.w) p.push(r.w + ' жен');
  if (r.c) p.push(r.c + ' пар');
  if (!p.length && r.needTotal) return r.needTotal + ' чел';
  return p.join(' · ');
}

function needTotal(r) {
  const sum = (r.m || 0) + (r.w || 0) + (r.c || 0) * 2;
  return sum || r.needTotal || 0;
}

function dist(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(s)));
}

function cityOf(name) { return DATA.cities.find((c) => c.name === name); }
function hasPoint(c) { return !!(c && typeof c.lat === 'number' && typeof c.lon === 'number'); }

/* Область у позиции может быть не заполнена — и это тоже строка выбора, а не
   повод спрятать позицию: пустое имя приезжает с сервера отдельным пунктом
   (regions_block в navigator_api.py). */
const NO_REGION = 'Регион не указан';
function regionLabel(name) { return name || NO_REGION; }

function plural(n, one, few, many) {
  const tens = n % 100, ones = n % 10;
  if (tens >= 11 && tens <= 14) return many;
  if (ones === 1) return one;
  if (ones >= 2 && ones <= 4) return few;
  return many;
}

function geoSummary() {
  const parts = [];
  if (S.regions.length) parts.push(S.regions.length + ' ' + plural(S.regions.length, 'область', 'области', 'областей'));
  if (S.sel.length) parts.push(S.sel.length + ' ' + plural(S.sel.length, 'город', 'города', 'городов'));
  return parts.length ? 'выбрано: ' + parts.join(' · ') : 'вся страна';
}

function nearNames() {
  if (!S.radius || !S.sel.length) return [];
  const anchors = S.sel.map(cityOf).filter(hasPoint);
  if (!anchors.length) return [];
  return DATA.cities
    .filter((c) => S.sel.indexOf(c.name) < 0 && hasPoint(c))
    .filter((c) => anchors.some((a) => dist(a, c) <= S.radius))
    .map((c) => c.name);
}

/* Слой мотивации: процент считается от оплаты контрагента за кандидата,
   а не от ставки кандидата. Нет строки в таблице — «не задана». */
/* Ставка приходит уже подобранной под позицию (см. registry/rates.py): бэкенд
   знает про лестницу по сменам и исключения по объектам, фронт только
   показывает. */
function rec(r) { return r.rec || null; }
function recAmount(m) { return m ? m.amount : 0; }
function recText(r) {
  const m = rec(r);
  return m ? money(m.amount) : '';
}
function recFormula(m) {
  if (!m) return '';
  const parts = [];
  if (m.tier) parts.push('за вахту от ' + m.tier + ' смен');
  if (m.scope) parts.push(m.scope);
  return parts.join(' · ');
}
function recLadder(m) {
  if (!m || !m.tiers || m.tiers.length < 2) return '';
  return m.tiers.map((t) => t.minShifts + ' смен — ' + money(t.amount)).join(' · ');
}
/* Подпись видит только администратор: сколько из выставленной суммы получит
   рекрутер. Самому рекрутеру не показываем ни долю, ни процент — назвав
   процент, мы бы отдали и сумму контракта: она получается обратным умножением.
   Процент для этого и не приходит: DATA.ratePercent у рекрутера пустой
   (см. apply_role_visibility в navigator_api.py). */
function recShareNote(m) {
  const pct = DATA.ratePercent;
  if (!m || !m.amount || !pct) return '';
  return 'рекрутер видит ' + money(Math.round(m.amount * pct / 100)) + ' (' + pct + ' %)';
}

function ageText(r) {
  if (r.ageFrom && r.ageTo) return r.ageFrom + '–' + r.ageTo;
  if (r.ageTo) return 'до ' + r.ageTo;
  if (r.ageFrom) return 'от ' + r.ageFrom;
  return '';
}

function houseText(r) {
  const h = r.house;
  if (h.st === 'no') return 'Не предоставляется';
  if (h.st === 'na') return '';
  const cost = h.cost === 'free' ? 'Бесплатно'
    : (h.cost === 'deduct' ? 'С удержанием'
      : (h.cost === 'paid' ? 'Платно' : 'Предоставляется'));
  const parts = [cost];
  if (h.type) parts.push(h.type);
  if (h.per) parts.push(h.per + ' человека в комнате');
  return parts.join(', ');
}

function houseState(r) {
  const h = r.house;
  if (h.st === 'na') return 'na';
  if (h.st === 'no') return 'no';
  return 'yes';
}

function mealsText(r) {
  const m = r.meals;
  if (m.st === 'na') return '';
  if (m.st === 'no') return 'Не предоставляется';
  if (m.st === 'paid') return 'Платная столовая' + (m.note ? ' — ' + m.note : '');
  if (m.st === 'deduct') return 'Есть, с удержанием' + (m.times ? ', ' + m.times + ' раза в смену' : '');
  if (m.st === 'free') return 'Бесплатно' + (m.times ? ', ' + m.times + ' раз в смену' : '');
  return 'Предоставляется' + (m.times ? ', ' + m.times + ' раз в смену' : '');
}

function travelText(r) {
  const t = r.travel;
  if (t.st !== 'yes') return '';
  const p = [t.full === 'full' ? 'Компенсируется полностью'
    : (t.full === 'part' ? 'Частичная компенсация' : 'Компенсируется')];
  if (t.amount) p.push(t.amount);
  if (t.route) p.push(t.route);
  if (t.when) p.push(t.when);
  if (t.terms) p.push(t.terms);
  return p.join(', ');
}

/* Когда платят — это уходит кандидату. */
function payScheduleText(r) {
  const p = r.pay;
  if (p.st !== 'yes') return '';
  let out = p.freq || '';
  if (p.advance === 'yes') out += ', аванс' + (p.advAfter ? ' после ' + p.advAfter + ' смен' : '');
  if (p.advance === 'no') out += ', без аванса';
  return out;
}

/* Куда платят — только рекрутёру, как и оформление. У этих «да» есть
   условия, которые в одну строку кандидату не влезают: у КНК третье лицо
   обязано быть совершеннолетним самозанятым, у Аметиста это самозанятость на
   третье лицо через «Консоль». Рекрутёр видит их цитатой (r.pay.note) и
   проговаривает сам. */
function payMethodsText(r) {
  const p = r.pay, out = [];
  if (p.third === 'yes') out.push('на карту третьего лица');
  if (p.third === 'no') out.push('на третье лицо не платят');
  if (p.cash === 'yes') out.push('наличными');
  if (p.cash === 'no') out.push('без наличного расчёта');
  return out.join(', ');
}

function payText(r) {
  const out = [payScheduleText(r), payMethodsText(r)].filter(Boolean).join(', ');
  return out ? out.charAt(0).toUpperCase() + out.slice(1) : '';
}

function dedLine(d) {
  const unit = d.unit === 'shift' ? 'за смену'
    : (d.unit === 'day' ? 'в день' : (d.unit === 'month' ? 'в месяц' : (d.unit === 'once' ? 'единоразово' : '')));
  return d.basis + ' — ' + money(d.amount) + (unit ? ' ' + unit : '');
}

function medText(r) {
  if (r.med === 'no') return 'Не нужна';
  if (r.med === 'need') return 'Нужна, выход только с ней';
  if (r.med === 'arranged') return 'Нужна, можно выйти без неё';
  return '';
}

function sbText(r) {
  if (r.sb === 'none') return 'Нет';
  if (r.sb === 'part') return 'Выборочная';
  if (r.sb === 'full') return 'Полная';
  return '';
}

function testText(r) {
  if (r.test === 'yes') return 'Требуется';
  if (r.test === 'no') return 'Не требуется';
  return '';
}

function mediaList(r) {
  const seen = {}, out = [];
  (r.media || []).forEach((m) => {
    const key = m.kind + '|' + String(m.url).toLowerCase().replace(/\?.*$/, '');
    if (seen[key]) return;
    seen[key] = 1;
    if (m.kind === 'housing_photo' && r.house.st !== 'yes') return;
    out.push(m);
  });
  return out;
}

function extTitle(r) { return DATA.cpTitles[r.id] || { t: r.prof, ref: '' }; }

function rowById(id) { return DATA.rows.find((r) => r.id === id); }

/* Очередь администратора: только реальные исключения. Пустое необязательное
   поле — «Не указано», а не ошибка. */
function issues(r) {
  const out = [];
  const REQ = DATA.required || {};
  const done = (code, field) => !!S.fixes[r.id + '|' + code + '|' + field];
  const add = (o) => {
    if (done(o.code, o.field)) return;
    out.push(Object.assign({
      id: r.id + '|' + o.code + '|' + o.field, row: r.id, values: [],
      sev: ISSUE_KINDS[o.code].sev, dot: ISSUE_KINDS[o.code].dot, status: ISSUE_KINDS[o.code].label
    }, o));
  };

  (DATA.conflicts[r.id] || []).forEach((c) => add({
    code: 'conflict', field: c.field, label: c.label, what: c.what,
    values: c.values, recommend: c.recommend, choice: true
  }));

  if (DATA.dupes[r.id]) add({
    code: 'duplicate', field: 'position', label: 'Дубль позиции',
    what: 'Та же связка контрагент + объект + должность пришла дважды: ' + r.id + ' и ' + DATA.dupes[r.id] + '.',
    values: [{ src: r.id, v: r.src }, { src: DATA.dupes[r.id], v: 'вторая заявка' }],
    recommend: 'Объединить, если это одна потребность', dup: true, dupWith: DATA.dupes[r.id]
  });

  if (REQ.cits && !r.cits.length) add({
    code: 'missing', field: 'citizenship', label: REQ.cits,
    what: 'Обязательное поле пустое. Подставлять гражданство по прошлым заявкам контрагента нельзя.',
    recommend: 'Запросить у заказчика или отметить «нет в источнике»', input: true
  });
  if (REQ.house && r.house.st === 'na') add({
    code: 'missing', field: 'housing', label: REQ.house,
    what: 'Не указано, предоставляется ли проживание.', recommend: 'Уточнить: есть / нет / условия', input: true
  });
  if (REQ.meals && r.meals.st === 'na') add({
    code: 'missing', field: 'meals', label: REQ.meals,
    what: 'Не указано, есть ли питание.', recommend: 'Уточнить у заказчика', input: true
  });
  if (REQ.rate && !r.rate) add({
    code: 'missing', field: 'rate', label: REQ.rate,
    what: 'Ставка за смену не распозналась — кандидату называть нечего.',
    recommend: 'Уточнить ставку за смену', input: true
  });
  if (REQ.sched && !r.sched) add({
    code: 'missing', field: 'schedule', label: REQ.sched,
    what: 'График не указан.', recommend: 'Уточнить график', input: true
  });
  if (REQ.need && !needTotal(r)) add({
    code: 'missing', field: 'need', label: REQ.need,
    what: 'Не указано, сколько людей нужно.', recommend: 'Уточнить потребность', input: true
  });

  (r.media || []).forEach((m) => {
    if (m.alive) return;
    add({
      code: 'source', field: 'media.' + m.kind, label: (MEDIA_META[m.kind] || {}).label || 'Материал',
      what: 'Ссылка не открывается с ' + m.upd + '. Кандидату такой материал не отправляем.',
      values: [{ src: m.src, v: m.url }],
      recommend: 'Заменить ссылку или убрать материал', link: m.url, media: true
    });
  });

  return out.sort((a, b) => a.sev - b.sev);
}

function resolve(iss, action, value) {
  const fixes = Object.assign({}, S.fixes);
  fixes[iss.row + '|' + iss.code + '|' + iss.field] = { action: action, value: value || '' };
  S.fixes = fixes;
  const row = rowById(iss.row);
  const left = row ? issues(row).filter((x) => x.id !== iss.id).length : 0;
  toast(left ? 'Исправлено · перепроверка: осталось ' + left : 'Исправлено · перепроверка пройдена, заявка ушла из очереди');
}

/* ---- показ работодателя кандидату: контрагент наружу не уходит ---- */
function employer(r) {
  const mode = PROPS.employerDisplay || 'alias';
  const geo = [r.city, r.district].filter(Boolean).join(', ');
  if (mode === 'geo') return geo;
  if (mode === 'none') return r.sched;
  if (mode === 'type') return r.cpType || '';
  // Публичного алиаса контрагента в системе нет — вместо него категория
  // объекта («склад», «производство»). Нет и её — работодателя не называем
  // вовсе: подставлять формат работы («на вахта») или город бессмысленно.
  return r.cpAlias || r.cpType || '';
}

function scrub(text, r) {
  const bad = [r.cp, r.obj, r.src].filter(Boolean);
  /* Ссылки выносим из-под замены: вырезать название объекта из текста нужно,
     а из адреса папки с фотографиями — значит выдать кандидату битую ссылку. */
  const urls = [];
  let out = String(text).replace(/https?:\/\/\S+/g, (u) => '@@URL' + (urls.push(u) - 1) + '@@');
  const hit = [];
  bad.forEach((b) => {
    const re = new RegExp(String(b).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    if (re.test(out)) { hit.push(b); out = out.replace(re, '———'); }
  });
  out = out.replace(/@@URL(\d+)@@/g, (_, i) => urls[Number(i)]);
  return { text: out, removed: hit };
}

/* §11 — только подтверждённое, без внутреннего, в заданном порядке. */
function candidateText(r, picked) {
  const L = [];
  const place = [r.city, r.district].filter(Boolean).join(', ');
  const emp = employer(r);
  L.push(r.prof + (emp ? ' на ' + String(emp).toLowerCase() : '') + (place ? ', ' + place : '') + '.');

  const rate = [];
  if (r.rate) rate.push('Ставка — ' + money(r.rate) + ' за смену');
  if (r.hourly) rate.push(r.hourly + ' ₽ в час');
  if (r.sched) rate.push('график ' + r.sched.replace(/ по .*$/, ''));
  if (r.hours) rate.push('смена ' + r.hours + ' часов');
  if (rate.length) L.push(rate.join(', ') + '.');

  const req = [];
  if (r.gender) req.push(r.gender === 'любые' ? 'мужчины и женщины' : r.gender);
  const age = ageText(r);
  if (age) req.push(age === 'до ' + r.ageTo ? 'до ' + r.ageTo + ' лет' : age + ' лет');
  if (r.cits.length) req.push('гражданство ' + r.cits.join(', '));
  if (req.length) L.push('Требуются ' + req.join(', ') + '.');
  /* Поле «Требования» в реестре — сырая строка источника («РФ (Кавказ МОЖНО,
     Цыгане запрет), М 18-55»). Кандидату такое не отправляем: пол, возраст и
     гражданство уже сказаны строкой выше, а остальное видно в «Подробнее».
     Разобранное r.eth сюда не добавлять по той же причине, только сильнее:
     это ограничение по национальности, и отправлять его человеку, которого
     оно касается, мы не будем. Оно живёт в фильтре и в карточке рекрутёра. */

  if (r.house.st === 'yes') {
    const h = r.house, parts = [];
    parts.push(h.cost === 'free' ? 'Проживание бесплатное'
      : (h.cost === 'deduct' ? 'Проживание с удержанием'
        : (h.cost === 'paid' ? 'Проживание платное' : 'Проживание предоставляется')));
    if (h.type) parts.push(h.type);
    if (h.per) parts.push(h.per + ' человека в комнате');
    if (h.linen) parts.push('постельное бельё выдаётся');
    if (h.transfer) parts.push(h.transfer);
    L.push(parts.join(', ') + '.');
  } else if (r.house.st === 'no') {
    L.push('Проживание не предоставляется.');
  }

  const meals = mealsText(r);
  if (meals) L.push('Питание: ' + meals.charAt(0).toLowerCase() + meals.slice(1) + '.');

  const payParts = [];
  const pay = payScheduleText(r);
  if (pay) payParts.push('Выплаты ' + pay.charAt(0).toLowerCase() + pay.slice(1));
  if (r.dedSt === 'yes') payParts.push('удержания: ' + r.ded.map((d) => dedLine(d).toLowerCase()).join('; '));
  if (r.dedSt === 'no') payParts.push('удержаний нет');
  // Периодичность выплат парсер не извлекает, поэтому строка часто начинается
  // с удержаний — и тогда предложение должно начинаться с заглавной.
  if (payParts.length) L.push(payParts.join('. ').replace(/^./, (c) => c.toUpperCase()) + '.');

  const tr = travelText(r);
  if (tr) L.push('Проезд: ' + tr.charAt(0).toLowerCase() + tr.slice(1) + '.');
  else if (r.travel.st === 'no') L.push('Проезд не компенсируется.');

  const check = [];
  const med = medText(r); if (med) check.push('медкнижка — ' + med.toLowerCase());
  const sb = sbText(r); if (sb) check.push('проверка СБ — ' + sb.toLowerCase());
  const test = testText(r); if (test) check.push('тестирование — ' + test.toLowerCase());
  if (check.length) L.push(check.join(', ').replace(/^./, (c) => c.toUpperCase()) + '.');

  L.push('Если подходит — напишите, забронирую место и пришлю порядок выхода.');

  const links = mediaList(r).filter((m) => m.vis === 'public' && m.alive && picked[r.id + '|' + m.kind]);
  if (links.length) {
    L.push('');
    L.push('Подробнее:');
    links.forEach((m) => {
      const meta = MEDIA_META[m.kind];
      L.push(meta.emoji + ' ' + meta.text + ': ' + m.url);
    });
  }
  return scrub(L.join('\n'), r);
}

/* ---- ограничения по национальности: только внутрь, кандидату не уходит ---- */
/* Заказчики пишут «строго не Кавказ» и «СТРОГО НЕ ЦЫГАН» открытым текстом, и
   рекрутёру это знать надо — иначе человека везут на объект, где ему откажут
   на проходной. Но в candidateText эта строка не попадает и попасть не должна:
   там текст, который уходит самому кандидату. */
const ETH_LABEL = {
  kav: { ban: 'Кавказ — запрет', women: 'Кавказ — только женщин', ok: 'Кавказ — можно' },
  gyp: { ban: 'цыгане — запрет', women: 'цыгане — только женщин', ok: 'цыгане — можно' }
};

function ethState(r, key) {
  return ((r.eth || {})[key] || {}).st || 'na';
}

function ethText(r) {
  return ['kav', 'gyp'].map((k) => ETH_LABEL[k][ethState(r, k)] || '').filter(Boolean).join(', ');
}

/* То же самое, но с дословной цитатой из заявки: разбор эвристический, и
   рекрутёр должен видеть, из какой формулировки он сделан. */
function ethDetail(r) {
  return ['kav', 'gyp'].map((k) => {
    const label = ETH_LABEL[k][ethState(r, k)];
    if (!label) return '';
    const note = ((r.eth || {})[k] || {}).note;
    return label + (note ? ' («' + note + '»)' : '');
  }).filter(Boolean).join('; ');
}

/* =============================== фильтрация =============================== */

function passAge(r, age) {
  if (!age) return true;
  const a = Number(age);
  if (r.ageFrom && a < r.ageFrom) return false;
  if (r.ageTo && a > r.ageTo) return false;
  return true;
}

/* Длина заезда. «15» и «20» — ровно столько смен, «от 30» — всё, что длиннее.
   Порог «от 15» для первых двух пунктов сделал бы фильтр бесполезным: заезды в
   реестре стоят кучно (15, 20, 30, 35, 45), и «от 15» оставляет 931 позицию из
   1114 — то есть почти всю выдачу. Позиции, где минимум не указан, под фильтр
   не попадают: подставлять им обычные 20 смен значит врать кандидату о длине
   вахты, а таких позиций каждая седьмая. */
function passShifts(r) {
  if (!S.fShifts) return true;
  const n = Number(r.minShifts);
  if (!n) return false;
  return S.fShifts === '30' ? n >= 30 : n === Number(S.fShifts);
}

/* География: области и города складываются, а не пересекаются.
   Выбраны Тульская область и Москва — покажем и то, и другое. Пересечение
   («город внутри выбранной области») читалось бы как обнуление выдачи: клик по
   городу из другой области оставлял бы пустой список, и объяснить это в
   интерфейсе нечем. Позиции без города ловятся только областью. */
function passGeo(r) {
  if (!S.regions.length && !S.sel.length) return true;
  if (S.regions.length && S.regions.indexOf(r.region || '') >= 0) return true;
  return S.sel.length > 0 && S.sel.concat(nearNames()).indexOf(r.city) >= 0;
}

/* Фильтр «Гражданство» — это страна кандидата, а заявка пишет, кого
   берут. «ЕАЭС» в заявке открывает дорогу всем странам союза, «СНГ» — ещё
   и Узбекистану с Таджикистаном: так пишет Табия, а где узбеки не нужны,
   там у неё «нельзя СНГ». Отдельной строкой «Узбекистан» за всю историю
   реестра не написал никто, поэтому без «СНГ» фильтр по ним был бы пуст.
   Те же наборы у ИИ-помощника — EAEU и CIS в nav_assistant.py. */
const CIT_EAEU = ['РФ', 'РБ', 'КЗ', 'КРГ', 'АРМ'];
const CIT_CIS = CIT_EAEU.concat(['УЗБ', 'ТДЖ']);

function citOk(r, code) {
  return r.cits.indexOf(code) >= 0
    || (r.cits.indexOf('ЕАЭС') >= 0 && CIT_EAEU.indexOf(code) >= 0)
    || (r.cits.indexOf('СНГ') >= 0 && CIT_CIS.indexOf(code) >= 0);
}

function pass(r) {
  if (!passGeo(r)) return false;
  if (S.rateMin && (!r.rate || r.rate < Number(S.rateMin))) return false;

  const m = rec(r);
  if (S.fRec === 'set' && !m) return false;
  if (S.fRec === 'none' && m) return false;
  if (S.fRec === 'expired' && !(m && m.expired)) return false;

  if (S.fHouse === 'yes' && r.house.st !== 'yes') return false;
  if (S.fHouse === 'free' && !(r.house.st === 'yes' && r.house.cost === 'free')) return false;
  if (S.fHouse === 'no' && r.house.st !== 'no') return false;

  if (S.fMeals === 'yes' && ['free', 'deduct', 'paid', 'yes'].indexOf(r.meals.st) < 0) return false;
  if (S.fMeals === 'free' && r.meals.st !== 'free') return false;
  if (S.fMeals === 'no' && r.meals.st !== 'no') return false;

  if (S.fCit && !citOk(r, S.fCit)) return false;

  if (S.fEth) {
    const kav = ethState(r, 'kav'), gyp = ethState(r, 'gyp');
    // Молчание заявки — это «не написано», а не «можно»: про Кавказ молчат
    // две трети позиций. Из подбора мы их не выкидываем (иначе фильтр съест
    // почти всю выдачу), но и за разрешение не выдаём — в карточке у них
    // пусто, и это повод спросить заказчика, а не везти человека наугад.
    if (S.fEth === 'kav' && kav === 'ban') return false;
    if (S.fEth === 'gyp' && gyp === 'ban') return false;
    // «Прямо разрешено» — это только те, где заказчик написал «можно».
    // «Можно женщин» сюда входит: это разрешение, просто с оговоркой,
    // а пол отсекается отдельным фильтром.
    if (S.fEth === 'kavOk' && ['ok', 'women'].indexOf(kav) < 0) return false;
    if (S.fEth === 'ban' && kav !== 'ban' && gyp !== 'ban') return false;
  }

  /* Потребность тоже ответ: «Упаковщик 15Ж» без графы «пол» — это вакансия
     для женщин. На 07.10.2026 пол пуст у 80 активных позиций из 274, и у 29
     из них в потребности прямо стоят и мужчины, и женщины. */
  if (S.fGender === 'мужчины' && !(r.gender === 'мужчины' || r.gender === 'любые' || r.m > 0)) return false;
  if (S.fGender === 'женщины' && !(r.gender === 'женщины' || r.gender === 'любые' || r.w > 0)) return false;
  if (S.fGender === 'пары' && !r.c) return false;

  if (!passAge(r, S.ageCand)) return false;
  if (!passShifts(r)) return false;

  if (S.fMed === 'no' && r.med !== 'no') return false;
  if (S.fMed === 'arranged' && ['no', 'arranged'].indexOf(r.med) < 0) return false;

  if (S.fSb === 'none' && r.sb !== 'none') return false;
  if (S.fSb === 'notfull' && r.sb === 'full') return false;

  if (S.fSched && r.schedKind !== S.fSched) return false;

  // Заявка молчит про оформление — позиция не подходит ни под «ТК», ни под
  // «ГПХ»: мы не знаем, что там, и угадывать за контрагента не будем.
  if (S.fHire && (r.hire || []).indexOf(S.fHire) < 0) return false;
  if (S.fPay === 'third' && !r.pay3) return false;
  if (S.fPay === 'cash' && !r.payCash) return false;

  if (S.scope === 'req' && DATA.activeRequest && !new RegExp(DATA.activeRequest.match, 'i').test(r.prof)) return false;
  if (S.scope === 'gaps' && issues(r).length === 0) return false;

  if (S.q) {
    const hay = [r.prof, r.req, r.cp, r.obj, r.city, r.district, r.region, r.cits.join(' '), r.sched, r.src]
      .join(' ').toLowerCase().replace(/ё/g, 'е');
    const toks = S.q.toLowerCase().replace(/ё/g, 'е').split(/\s+/).filter(Boolean);
    if (!toks.every((t) => hay.indexOf(t) >= 0)) return false;
  }
  return true;
}

/* Поиск по внутреннему коду позиции (ELT-2026-000123-01).

   Код стоит в карточке, в подробностях и в очереди «Требуют решения» — его
   копируют и присылают коллеге, а тот вставляет в поиск. Поэтому код работает
   не как ещё одно поле в общем тексте, а как переход к позиции: найденное по
   коду показываем мимо остальных фильтров и выбранных городов. Иначе
   вставленный код упирается в «позиций нет» из-за фильтра, поставленного
   полчаса назад, и человек решает, что позиции больше нет.

   Сверяем по цифрам, а не по строке целиком: буквенный префикс у всех кодов
   один и смысла не несёт, зато набирают его и в русской раскладке, и в любом
   регистре. Второй вариант — с отрезанными ведущими нулями: «ELT-2026-123-1»
   и «ELT-2026-000123-01» для человека один и тот же код. */
function codeDigits(value) {
  return String(value == null ? '' : value).replace(/\D+/g, '');
}

/* Тот же код без ведущих нулей — группами и с дефисом по краям, чтобы кусок
   совпадал только по границам групп. Склей их в одну строку — «000026-02»
   вытащит и ELT-2026-000267-01 («…20|26-2|67…»), а это уже не поиск, а
   выдача наугад. */
function codeShort(value) {
  const groups = String(value == null ? '' : value)
    .split(/\D+/).filter(Boolean).map((part) => part.replace(/^0+(?=\d)/, ''));
  return groups.length ? '-' + groups.join('-') + '-' : '';
}

/* Запрос, похожий на код, — в двух написаниях. Не похож — null. */
function codeParts(q) {
  // Префикс (до четырёх букв) отбрасываем, дальше кода быть ничего не может:
  // «смена 15 000» — это текст, а не код.
  const rest = String(q || '').trim().replace(/^[a-zа-яё]{1,4}[\s\-–—]*/i, '');
  if (!rest || /[^\d\s\-–—_./№#]/.test(rest)) return null;
  const digits = codeDigits(rest);
  // Меньше пяти цифр — это год, ставка или число смен: в коде заявки их десять,
  // в коде позиции двенадцать, и даже хвост «123-01» даёт пять.
  if (digits.length < 5) return null;
  return { digits: digits, short: codeShort(rest) };
}

/* Позиции, найденные по коду, или null — если запрос не про код.

   Ничего не нашли — тоже null: «25000» без совпадения должно остаться
   обычным поиском по тексту заявки, а не превращаться в пустую выдачу. */
function codeHits(q) {
  const parts = codeParts(q);
  if (!parts) return null;
  const found = DATA.rows.filter((r) => [r.id, r.ext].some((code) => code
    && (codeDigits(code).indexOf(parts.digits) >= 0 || codeShort(code).indexOf(parts.short) >= 0)));
  return found.length ? found : null;
}

function sorted(rows) {
  const anchor = S.sel.length ? cityOf(S.sel[0]) : null;
  const out = rows.slice();
  if (S.sort === 'need') out.sort((a, b) => needTotal(b) - needTotal(a));
  else if (S.sort === 'fresh') out.sort((a, b) => String(b.seenAt).localeCompare(String(a.seenAt)));
  else if (S.sort === 'dist' && hasPoint(anchor)) out.sort((a, b) => {
    const ca = cityOf(a.city), cb = cityOf(b.city);
    const da = hasPoint(ca) ? dist(anchor, ca) : 1e9;
    const db = hasPoint(cb) ? dist(anchor, cb) : 1e9;
    return da - db;
  });
  else if (S.sort === 'rec') out.sort((a, b) => recAmount(rec(b)) - recAmount(rec(a)));
  else out.sort((a, b) => (b.rate || 0) - (a.rate || 0));
  return out;
}

function field(k, v, st) {
  return { k: k, v: v || '', ok: st === 'yes', no: st === 'no', def: st === 'def', conf: st === 'conflict', na: st === 'na' };
}

/* ---------------------------- запрос контрагенту --------------------------- */

/* Контрагент держит десятки вакансий, и наш ELT-… ему ничего не говорит: это
   номер нашего реестра, в его переписке такого номера нет. Позицию опознаём
   тем, что он прислал сам, — город, заказчик или объект, его формулировка
   должности, ставка и график. */

const GREETING = 'Добрый день!';
const ASK_INTRO = 'Уточните, пожалуйста, по вакансиям ниже — без этих данных мы не можем подобрать людей.';
const NO_CITY = 'Город не указан';

/* Что считается ответом по каждому полю. Без этого на «отсутствует
   проживание» приходит «есть», и вопрос про удержание уходит вторым кругом.
   Название поля берём то же, что стоит в строке позиции, — чтобы ответ
   складывался с вопросом без перевода. */
const FIELD_ASK = {
  citizenship: 'кого можно оформлять — РФ, РБ, ЕАЭС, патент',
  housing: 'есть или нет; если есть — что за жильё и сколько удерживаете',
  meals: 'есть или нет; если есть — бесплатное или с удержанием',
  rate: 'сколько выходит за смену на руки',
  schedule: 'сколько смен на вахте и сколько часов в смене',
  need: 'сколько человек нужно и к какой дате',
  place: 'в каком городе и на каком объекте работа'
};
const ASK_ORDER = Object.keys(FIELD_ASK);

function shorten(text, limit) {
  const s = String(text == null ? '' : text).trim();
  if (s.length <= limit) return s;
  let cut = s.slice(0, limit);
  /* Обрыв внутри скобки читается как ошибка — уносим её целиком. */
  if (cut.split('(').length > cut.split(')').length) cut = cut.slice(0, cut.lastIndexOf('('));
  const space = cut.lastIndexOf(' ');
  if (space > limit * 0.6) cut = cut.slice(0, space);
  return cut.replace(/[\s,;.·-]+$/, '') + '…';
}

/* Подпись позиции. Ставка и график здесь не условия, а приметы: две одинаково
   названные вакансии на одном объекте различаются именно ими. */
function outreachHead(r) {
  const parts = [extTitle(r).t || r.prof];
  if (r.rate) parts.push(money(r.rate) + '/смена');
  if (r.sched) parts.push(shorten(r.sched, 44));
  if (r.shiftType && r.shiftType !== 'дневная и ночная') parts.push(r.shiftType + ' смена');
  return parts.join(' · ');
}

/* Где и у кого. Источник (Градус, ЯППИ) в заказчики не пишем — он и есть
   получатель запроса, для него это была бы подсказка «у вас». */
function outreachPlace(r) {
  const parts = [[r.city, r.district].filter(Boolean).join(', ') || r.region || NO_CITY];
  /* Объект и заказчик часто повторяют город и друг друга («Атяшево» в
     Атяшеве, «Миксит склад» и «Миксит») — повтор ничего не уточняет. */
  [r.obj, r.cp === r.src ? '' : r.cp].filter(Boolean).forEach((name) => {
    if (parts.every((p) => p.toLowerCase().indexOf(name.toLowerCase()) < 0)) parts.push(name);
  });
  return parts.join(' · ');
}

function outreachText(items, greet) {
  const order = [], byPlace = {};
  items.forEach((it) => {
    const list = byPlace[it.place] || (order.push(it.place), byPlace[it.place] = []);
    const key = it.head + '|' + it.fields.map((f) => f.k).join(',');
    /* Совпавшие строки склеиваем: для контрагента это одна вакансия, и
       спрашивать про неё дважды в одном сообщении незачем. */
    if (list.every((x) => x.key !== key)) list.push(Object.assign({ key: key }, it));
  });

  /* По алфавиту, «Город не указан» — в конец: список читают глазами, и один
     и тот же запрос должен выглядеть завтра так же, как сегодня. */
  order.sort((a, b) => (a.indexOf(NO_CITY) === 0) - (b.indexOf(NO_CITY) === 0) || a.localeCompare(b, 'ru'));

  const L = [(greet ? GREETING + ' ' : '') + (DATA.template || ASK_INTRO)];
  const asked = [];
  let n = 0;
  order.forEach((place) => {
    L.push('', place);
    byPlace[place].forEach((it) => {
      it.fields.forEach((f) => { if (asked.every((x) => x.k !== f.k)) asked.push(f); });
      L.push(++n + '. ' + it.head + ' — ' + it.fields.map((f) => f.t).join(', '));
    });
  });

  asked.sort((a, b) => ASK_ORDER.indexOf(a.k) - ASK_ORDER.indexOf(b.k));
  L.push('', 'Что нужно уточнить:');
  asked.forEach((f) => L.push('• ' + f.t + ': ' + FIELD_ASK[f.k]));
  if (n > 1) L.push('', 'Ответить удобно номерами: «1 — общежитие, удержание 250 ₽/сутки; 3 — нужно 10 человек».');
  return L.join('\n');
}

/* ============================ сборка вычислимого ============================ */

function computeOutreach() {
  const byCp = {};
  DATA.rows.forEach((r) => {
    /* Запрос уходит контрагенту (Градусу, ЯППИ), а не бренду заказчика:
       чат и договорённость есть именно с ним. */
    const cfg = DATA.cps.find((c) => c.name === r.src);
    if (cfg && (cfg.excluded || cfg.archived)) return;
    const miss = issues(r).filter((i) => i.code === 'missing');
    if (!miss.length) return;
    const b = byCp[r.src] || (byCp[r.src] = { rows: [], items: [], fields: [], cities: [] });
    const fields = miss.map((i) => ({ k: i.field, t: i.label.toLowerCase() }));
    /* Без города позицию некуда поставить на карте, а часто и не опознать —
       место спрашиваем наравне с пробелами реестра, но только заодно с ними:
       отдельного повода написать контрагенту оно не создаёт. */
    if (!r.city) fields.push({ k: 'place', t: 'город' });
    b.rows.push(r);
    b.items.push({ place: outreachPlace(r), head: outreachHead(r), fields: fields });
    fields.forEach((f) => { if (b.fields.indexOf(f.t) < 0) b.fields.push(f.t); });
    if (r.city && b.cities.indexOf(r.city) < 0) b.cities.push(r.city);
  });

  return Object.keys(byCp).sort((a, b) => byCp[b].rows.length - byCp[a].rows.length).map((cpName) => {
    const b = byCp[cpName];
    const cp = cpByName(cpName);
    const cities = b.cities.slice(0, 4).join(', ')
      + (b.cities.length > 4 ? ' и ещё ' + (b.cities.length - 4) : '');
    const text = outreachText(b.items, true);
    return {
      id: cp.id, cp: cpName,
      chat: cp.address || 'канал не настроен',
      summary: (cities ? 'города: ' + cities : 'город не указан') + ' · не хватает: ' + b.fields.join(', '),
      text: text,
      status: DATA.outreachEnabled ? 'Готово к отправке' : 'Не отправлено',
      dot: DATA.outreachEnabled ? 'rgb(var(--accent-2))' : 'rgb(var(--na))',
      greetNote: 'черновик запроса — приветствие будет в первом сообщении за день',
      meta: (DATA.outreachEnabled
        ? 'автоотправка в ' + SEND_TIME + ' · попытка 1 из ' + MAX_TRIES
        : 'автоотправка запросов не настроена (нет TELEGRAM_BOT_TOKEN)')
        + ' · заявок: ' + b.rows.length
        + ' · длина ' + spaced(text.length) + ' из ' + spaced(TG_LIMIT)
        + (text.length > TG_LIMIT ? ' — в одно сообщение Telegram не помещается' : '')
    };
  });
}

function computeExceptions() {
  const out = [];
  DATA.rows.forEach((r) => issues(r).forEach((i) => {
    if (i.code !== 'conflict' && i.code !== 'duplicate') return;
    if (i.code === 'duplicate' && i.dupWith < r.id) return;
    out.push({
      key: i.id, id: r.id, title: r.prof, place: r.city || 'город не указан',
      what: i.what, status: i.status, dot: i.dot,
      hasValues: i.values.length > 0 && !!i.choice,
      values: i.values, issue: i,
      history: i.recommend,
      isDup: !!i.dup,
      mainAction: i.dup ? 'Открыть обе заявки' : 'Уточнить в чате'
    });
  }));
  (DATA.sources || []).filter((x) => x.status === 'error').forEach((x) => out.push({
    key: x.id, id: x.id, title: x.cp, place: x.kind,
    what: 'Источник недоступен: ' + x.error + '. Последний успешный приём — ' + (x.last || 'нет данных') + '.',
    status: 'Ошибка источника', dot: 'rgb(var(--warn))', hasValues: false, values: [], issue: null,
    history: 'Проверяется при каждом прогоне · расписание ' + (x.times || 'не задано'),
    isDup: false, mainAction: 'Запросить новый доступ', source: true
  }));
  return out;
}

function deadLinks() {
  const links = [];
  DATA.rows.forEach((r) => (r.media || []).forEach((m) => {
    if (m.alive) return;
    links.push({
      label: (MEDIA_META[m.kind] || {}).label + ' · ' + r.prof, url: m.url,
      dot: 'rgb(var(--accent-2))', meta: 'перепроверяется · перепроверка каждые 6 часов'
    });
  }));
  return links;
}

const THEME_KEY = 'navTheme';

function themeOf(key) { return THEMES.find((t) => t.key === key) || THEMES[0]; }

function storedTheme() {
  try { return themeOf(localStorage.getItem(THEME_KEY)).key; } catch (e) { return THEMES[0].key; }
}

function applyTheme(key) {
  const t = themeOf(key);
  S.theme = t.key;
  try { localStorage.setItem(THEME_KEY, t.key); } catch (e) {}
  const root = document.documentElement;
  if (!root) return;                       // дымовой прогон: DOM там ненастоящий
  root.setAttribute('data-theme', t.key);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t.meta);
}

/* Новая тема раскрывается кругом от плитки, по которой щёлкнули. Без View
   Transitions (старый браузер) или при «уменьшить движение» — просто меняется. */
function switchTheme(key, el) {
  if (key === S.theme) return;
  try { localStorage.setItem('navThemeChosen', '1'); } catch (e) {}
  const apply = () => { applyTheme(key); render(); };
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!document.startViewTransition || reduce || !el || !el.getBoundingClientRect) { apply(); return; }
  const r = el.getBoundingClientRect();
  const x = Math.round(r.left + r.width / 2), y = Math.round(r.top + r.height / 2);
  const end = Math.ceil(Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y)));
  const t = document.startViewTransition(apply);
  t.ready.then(() => document.documentElement.animate(
    { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + end + 'px at ' + x + 'px ' + y + 'px)'] },
    { duration: 700, easing: 'cubic-bezier(.4,0,.2,1)', pseudoElement: '::view-transition-new(root)' }
  )).catch(() => {});
}

  const btn = document.querySelector('[data-theme-btn]');
  if (!pop || !btn || !window.innerWidth || window.innerWidth <= 700) return;
  const r = btn.getBoundingClientRect();
  // right у fixed считается от края без полосы прокрутки — отсюда clientWidth, а не innerWidth.
  const width = document.documentElement.clientWidth || window.innerWidth;
  pop.style.top = Math.round(r.bottom + 10) + 'px';
  pop.style.right = Math.max(12, Math.round(width - r.right)) + 'px';
}
if (window.addEventListener) {
  window.addEventListener('resize', placeThemePop);
  window.addEventListener('scroll', placeThemePop, { passive: true });
}

let _resetList = false;

function render() {
  const app = document.getElementById('app');
  const scrolls = {};
  document.querySelectorAll('[data-scroll]').forEach((el) => { scrolls[el.dataset.scroll] = el.scrollTop; });
  const active = document.activeElement;
  const focusId = active && active.dataset ? active.dataset.fid : null;
  /* selectionStart недоступен у number, email и date: спецификация велит вернуть
     null, часть браузеров бросает исключение. Молча терять позицию нельзя —
     focus() на только что созданном поле ставит каретку в начало строки, и
     набранное «30» превращается в «03». */
  let selStart = null;
  let selEnd = null;
  try {
    if (active && active.selectionStart != null) {
      selStart = active.selectionStart;
      selEnd = active.selectionEnd;
    }
  } catch (e) {}

  app.innerHTML = view();
  placeThemePop();

  document.querySelectorAll('[data-scroll]').forEach((el) => {
    const key = el.dataset.scroll;
    if (scrolls[key] != null && !(key === 'list' && _resetList)) el.scrollTop = scrolls[key];
  });
  _resetList = false;
  if (focusId) {
    const el = document.querySelector('[data-fid="' + focusId + '"]');
    if (el) {
      el.focus();
      const end = el.value == null ? 0 : String(el.value).length;
      const from = selStart == null ? end : selStart;   // позиция неизвестна — дописываем в конец
      const to = selEnd == null ? from : selEnd;
      let restored = false;
      if (el.setSelectionRange) {
        try { el.setSelectionRange(from, to); restored = true; } catch (e) {}
      }
      // Поля без поддержки выделения (number и прочие) — каретку в конец
      // перестановкой значения: это единственный способ, который они понимают.
      if (!restored && end) { const v = el.value; el.value = ''; el.value = v; }
    }
  }
}

function view() {
  if (S.loading) return shell('<div style="padding:80px 20px; text-align:center; color:rgba(var(--ink),.5); font-size:13px;">Загружаем реестр…</div>');
  if (S.error) return shell('<div style="padding:80px 20px; text-align:center;"><div style="font-size:15px; font-weight:600; color:rgb(var(--bad));">Не удалось загрузить данные</div><p style="margin:8px auto 0; max-width:420px; font-size:13px; line-height:1.6; color:rgba(var(--ink),.5);">' + esc(S.error) + '</p></div>');
  const screen = S.screen === 'search' ? viewSearch()
    : S.screen === 'chats' ? viewChats()
      : viewAdmin();
  return shell(screen) + viewModals();
}

function shell(inner) {
  return '<div style="width:min(1420px,100%); margin:0 auto; padding:clamp(16px,2.4vw,26px) clamp(14px,3vw,32px) 56px;">'

    + themeButton() + '</div></header>';

function viewAside() {
  const near = nearNames();
  const term = S.citySearch.trim().toLowerCase().replace(/ё/g, 'е');
  const anchor = S.sel.length ? cityOf(S.sel[0]) : null;
  const found = (text) => !term || String(text || '').toLowerCase().replace(/ё/g, 'е').indexOf(term) >= 0;
  const cities = DATA.cities.filter((c) => found(c.name + ' ' + (c.region || '')));
  const regions = (DATA.regions || []).filter((x) => found(regionLabel(x.name)));
  const byRegion = S.geoTab === 'reg';

  /* Колонка ровно по высоте окна и со своей прокруткой. Раньше здесь стояли
     min-height:520px и overflow:hidden: на нераскрытом окне колонка получалась
     выше доступного места, и низ — тумблер «Соседние города» — просто срезался,
     причём без полосы прокрутки, так что добраться до него было нечем. */
  let html = '<aside class="appScroll navAside" style="flex:1 1 320px; max-width:100%; display:flex; flex-direction:column; gap:12px; position:sticky; top:14px; height:calc(100vh - 124px); min-height:0; overflow-y:auto; overflow-x:hidden; padding-right:2px;">';

  /* География забирает всю свободную высоту, но не всю целиком: у панели
     фильтров под ней своя нижняя граница, иначе на невысоком экране она
     ужимается в полоску с одним видимым полем. Список внутри сам скроллится. */
  html += '<section class="liquid-glass" style="border-radius:18px; padding:18px; flex:1 1 auto; min-height:170px; display:flex; flex-direction:column; overflow:hidden;">'
    + '<div style="display:flex; align-items:baseline; justify-content:space-between; gap:10px;">'
    + '<h2 style="margin:0; font-size:15px; font-weight:600; letter-spacing:-.02em; color:rgb(var(--hi));">География</h2>'
    + '<span style="font-size:11.5px; color:rgba(var(--ink),.45);">' + esc(geoSummary()) + '</span>'
    + '</div>'
    /* Две вкладки, а не два списка подряд: панель и так на весь экран, а
       второй список отобрал бы у городов половину высоты. Первой стоит
       область — с неё начинается подбор («что есть в Тульской»), город
       уточняет уже внутри. */
    + '<div style="display:flex; gap:6px; margin-top:12px;">'
    + [{ key: 'reg', label: 'Области', count: (DATA.regions || []).length },
       { key: 'city', label: 'Города', count: DATA.cities.length }]
      .map((t) => '<button type="button" data-act="geoTab" data-arg="' + t.key + '"' + (S.geoTab === t.key ? '' : ' class="hLight"')

        + '; color:' + (S.geoTab === t.key ? 'rgb(var(--pop-ink))' : 'rgba(var(--ink),.7)') + '; font-size:12.5px;' + (S.geoTab === t.key ? ' font-weight:600;' : '')
        + ' cursor:pointer;' + (S.geoTab === t.key ? '' : ' transition:.2s;') + '">' + esc(t.label)
        + '<span style="font-size:11px; opacity:.55; font-variant-numeric:tabular-nums;">' + t.count + '</span></button>').join('')

    + '<div style="position:relative; margin-top:10px;">'
    + '<span style="position:absolute; left:13px; top:50%; transform:translateY(-50%); color:rgba(var(--ink),.45); display:flex;">' + SEARCH_ICON + '</span>'
    + '<input type="text" class="fLine" data-fid="citySearch" data-on="citySearch" placeholder="' + (byRegion ? 'Найти область' : 'Найти город') + '" value="' + attr(S.citySearch) + '" style="width:100%; height:34px; padding:0 14px 0 34px; border:1px solid rgba(var(--ink),.14); border-radius:9999px; background:rgba(var(--ink),.04); color:rgb(var(--text)); font-size:12.5px; outline:none;">'
