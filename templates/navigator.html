        + '<button type="button" data-act="cpRestore" data-arg="' + attr(a.id) + '" style="margin-left:auto; height:26px; padding:0 12px; border:1px solid rgba(255,255,255,.14); border-radius:9999px; background:rgba(255,255,255,.04); color:#E6F2FF; font-size:11.5px; cursor:pointer;">Восстановить</button>'
        + '</div>').join('')
      + '</div></div>';
  }

  html += '<div style="padding:14px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1);">'
    + '<div style="display:flex; flex-wrap:wrap; align-items:center; gap:8px;">'
    + '<span style="font-size:13.5px; font-weight:600; color:#fff;">Источники приёма</span>'
    + '<span style="margin-left:auto; font-size:11px; color:rgba(255,255,255,.35);">обновлено ' + esc(DATA.updatedAt || '—') + '</span></div>'
    + '<div style="display:flex; flex-direction:column; gap:6px; margin-top:10px;">'
    + (DATA.sources || []).map((s) => '<div style="display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:9px 11px; border-radius:12px; background:rgba(0,0,0,.22); border:1px solid rgba(255,255,255,.08);">'
      + '<span style="width:6px; height:6px; border-radius:9999px; background:' + (s.status === 'error' ? '#D9A441' : (s.pos ? '#6EE7C1' : '#64748B')) + ';"></span>'
      + '<span style="font-size:12.5px; color:#E6F2FF;">' + esc(s.cp) + '</span>'
      + '<span style="font-size:11.5px; color:rgba(255,255,255,.45);">' + esc(s.kind + ' · прогон ' + (s.times || '—') + ' · последний приём ' + (s.last || '—') + ' · позиций ' + s.pos) + '</span>'
      + (safeUrl(s.address) ? '<a href="' + safeUrl(s.address) + '" target="_blank" rel="noopener" style="margin-left:auto; font-size:11.5px;">открыть</a>' : '')
      + '</div>').join('')
    + '</div></div>';

  html += '<div style="padding:14px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1);">'
    + '<div style="display:flex; flex-wrap:wrap; align-items:center; gap:8px;">'
    + '<span style="font-size:13.5px; font-weight:600; color:#fff;">Конфигурация источников</span>'
    + '<span style="font-size:12px; color:rgba(255,255,255,.5);">' + esc(GITHUB.repo) + '</span>'
    + '<span style="margin-left:auto; font-size:11px; color:rgba(255,255,255,.35);">данные обновлены ' + esc(DATA.updatedAt || '—') + '</span></div>'
    + '<div style="font-size:12.5px; color:rgba(255,255,255,.7); margin-top:8px;">' + esc(GITHUB.file + ' · ветка ' + GITHUB.branch) + '</div>'
    + '<p style="margin:6px 0 0; font-size:11.5px; line-height:1.55; color:rgba(255,255,255,.45);">В GitHub — только код и развёртывание. Настройки контрагентов, чатов и шаблонов живут в системе; токены хранятся в защищённом хранилище и в репозиторий не попадают.</p>'
    + '<div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;">'
    + '<button type="button" data-act="ghSync" style="' + SMALL_WHITE + '">Синхронизировать</button>'
    + '<a href="' + GITHUB.file_url + '" target="_blank" rel="noopener" style="' + SMALL_PLAIN + ' display:inline-flex; align-items:center;">Открыть конфиг</a>'
    + '</div></div>';

  if (links.length) {
    html += '<div style="padding:14px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1);">'
      + '<div style="display:flex; flex-wrap:wrap; align-items:center; gap:8px;">'
      + '<span style="font-size:13.5px; font-weight:600; color:#fff;">Материалы и ссылки</span>'
      + '<span style="margin-left:auto; font-size:11px; color:rgba(255,255,255,.35);">перепроверка каждые 6 часов</span></div>'
      + '<div style="display:flex; flex-direction:column; gap:6px; margin-top:10px;">'
      + links.map((l) => '<div style="display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:9px 11px; border-radius:12px; background:rgba(0,0,0,.22); border:1px solid rgba(255,255,255,.08);">'
        + '<span style="width:6px; height:6px; border-radius:9999px; background:' + l.dot + ';"></span>'
        + '<span style="font-size:12.5px; color:#E6F2FF;">' + esc(l.label) + '</span>'
        + '<span style="font-size:11.5px; color:rgba(255,255,255,.45);">' + esc(l.meta) + '</span>'
        + '<a href="' + safeUrl(l.url) + '" target="_blank" rel="noopener" style="margin-left:auto; font-size:11.5px;">открыть</a></div>').join('')
      + '</div>'
      + '<p style="margin:9px 0 0; font-size:11.5px; line-height:1.55; color:rgba(255,255,255,.45);">Ссылка не удаляется: источник хранится, перепроверяется автоматически, а у заказчика запрашивается актуальная.</p>'
      + '</div>';
  }
  return html;
}

/* --------------------------------- модалки --------------------------------- */

/* Скроллит внутренняя обёртка, а не сама стеклянная карточка: рамка .liquid-glass::before —
   абсолютная с inset:0, у скролл-контейнера она меряется по видимой области и уезжает вместе
   с контентом, поэтому обводка обрывалась на середине длинной модалки. */
function overlay(label, width, inner, closeAct, scrollable) {
  const shell = 'width:min(' + width + ',100%); border-radius:16px; animation:appFade .25s cubic-bezier(.22,1,.36,1) both;'
    + (scrollable ? ' max-height:calc(100vh - 40px); display:flex; flex-direction:column;' : ' padding:24px;');
  const body = scrollable
    ? '<div class="appScroll dlgBody" style="flex:1 1 auto; min-height:0; overflow-y:auto; padding:24px;">' + inner + '</div>'
    : inner;
  return '<div role="dialog" aria-modal="true" aria-label="' + attr(label) + '" style="position:fixed; inset:0; z-index:80; display:grid; place-items:center; padding:20px;">'
    + '<div data-act="' + closeAct + '" style="position:absolute; inset:0; background:rgba(4,7,14,.66); backdrop-filter:blur(3px);"></div>'
    + '<div class="liquid-glass' + (scrollable ? ' dlgShell' : '') + '" style="' + shell + '">'
    + body + '</div></div>';
}

function viewModals() {
  let html = '';
  const gRow = S.gaps ? rowById(S.gaps) : null;
  if (gRow) {
    const list = issues(gRow);
    html += overlay('Незаполненные поля', '460px',
      '<h3 style="margin:0 0 4px; font-size:16px; font-weight:700; color:#fff;">' + esc('Требуют решения: ' + list.length + ' — ' + gRow.prof) + '</h3>'
      + '<p style="margin:0 0 16px; font-size:12.5px; line-height:1.55; color:rgba(255,255,255,.5);">Эти поля не заполнены в заявке — их нельзя озвучивать кандидату, пока заказчик не ответит.</p>'
      + '<div style="display:flex; flex-direction:column; gap:8px;">'
      + list.map((g) => '<div style="display:flex; align-items:flex-start; gap:9px; padding:11px 12px; border-radius:12px; background:rgba(20,30,52,.4); border:1px solid rgba(255,255,255,.1);">'
        + '<span style="flex:none; width:6px; height:6px; border-radius:9999px; background:' + g.dot + '; margin-top:6px;"></span>'
        + '<span style="flex:1; min-width:0;"><span style="display:block; font-size:13px; color:#E6F2FF;">' + esc(g.label) + '</span>'
        + '<span style="display:block; font-size:11.5px; color:rgba(255,255,255,.45); margin-top:2px;">' + esc(g.what) + '</span></span></div>').join('')
      + '</div>'
      + '<div style="display:flex; justify-content:flex-end; gap:8px; margin-top:20px;">'
      + '<button type="button" data-act="gClose" style="' + DLG_CANCEL + '">Закрыть</button>'
      + '<button type="button" data-act="gAsk" style="' + DLG_OK + '">Запросить у заказчика</button></div>', 'gClose', true);
  }

  const dRow = S.detail ? rowById(S.detail) : null;
  if (dRow) html += viewDetail(dRow);

  const mRow = S.modal ? rowById(S.modal) : null;
  if (mRow) html += viewCandidate(mRow);


  if (S.cpDelete) {
    const linked = DATA.rows.some((r) => r.cp === S.cpDelete.name);
    html += overlay('Удаление контрагента', '420px',
      '<h3 style="margin:0 0 4px; font-size:16px; font-weight:700; color:#fff;">Удалить контрагента «' + esc(S.cpDelete.name) + '»?</h3>'
      + '<p style="margin:0 0 16px; font-size:12.5px; line-height:1.55; color:rgba(255,255,255,.6);">' + (linked
        ? 'С контрагентом связаны заявки и история переписки. Данные не удаляются — контрагент уйдёт в архив, связи внутри системы сохранятся.'
        : 'Связанных заявок и переписки нет — контрагент будет удалён полностью.') + '</p>'
      + '<div style="font-size:11.5px; color:rgba(255,255,255,.5); margin-bottom:6px;">Для подтверждения введите название контрагента</div>'
      + '<input type="text" class="fLine" data-fid="delPass" data-on="delPass" data-enter="delConfirm" placeholder="' + attr(S.cpDelete.name) + '" value="' + attr(S.delPass) + '" style="width:100%; height:34px; padding:0 14px; border:1px solid rgba(255,255,255,.14); border-radius:9999px; background:rgba(255,255,255,.04); color:#E6F2FF; font-size:13px; outline:none;">'
      + (S.delErr ? '<div style="display:flex; align-items:center; gap:6px; margin-top:9px;"><span style="width:6px; height:6px; border-radius:9999px; background:#FF7B6B;"></span><span style="font-size:12px; color:#FF7B6B;">Название не совпало</span></div>' : '')
      + '<div style="display:flex; justify-content:flex-end; gap:8px; margin-top:20px;">'
      + '<button type="button" data-act="delCancel" style="' + DLG_CANCEL + '">Отмена</button>'
      + '<button type="button" data-act="delConfirm" style="height:34px; padding:0 16px; border:1px solid rgba(248,113,113,.35); border-radius:9999px; background:rgba(255,123,107,.14); color:#FF7B6B; font-size:12px; font-weight:600; cursor:pointer;">Подтвердить</button></div>', 'delCancel', false);
  }

  if (S.cpEdit) html += viewCpEdit();

  if (S.toast) {
    html += '<div style="position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:90; animation:appFade .25s cubic-bezier(.22,1,.36,1) both;">'
      + '<div class="liquid-glass" style="border-radius:9999px; padding:11px 20px; font-size:12.5px; color:#fff; white-space:nowrap;">' + esc(S.toast) + '</div></div>';
  }
  return html;
}

function viewCandidate(r) {
  const gen = candidateText(r, S.picks);
  const media = mediaList(r);
  let inner = '<h3 style="margin:0 0 4px; font-size:16px; font-weight:700; color:#fff;">Текст для кандидата</h3>'
    + '<p style="margin:0 0 16px; font-size:12.5px; line-height:1.55; color:rgba(255,255,255,.5);">Контрагент и объект вырезаны, работодатель показан алиасом. Ставка рекрутера и незаполненные поля в текст не попадают.</p>'
    + '<div style="display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:12px; background:rgba(164,244,253,.1); border:1px solid rgba(164,244,253,.3);">'
    + '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#A4F4FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7v5c0 4.4 3.2 8.3 8 9 4.8-.7 8-4.6 8-9V7z"></path></svg>'
    + '<span style="font-size:12.5px; color:#A4F4FD;">' + esc(employer(r) || 'работодатель в тексте не называется') + '</span></div>'
    + '<pre style="margin:14px 0 0; padding:16px; border-radius:12px; background:rgba(10,15,30,.6); border:1px solid rgba(255,255,255,.1); font-family:\'Inter\',system-ui,sans-serif; font-size:13.5px; font-weight:400; line-height:1.7; color:#E6F2FF; white-space:pre-wrap; word-break:break-word;">' + esc(gen.text) + '</pre>';

  if (media.length) {
    inner += '<div style="margin-top:16px;"><div style="display:flex; align-items:center; gap:9px;">'
      + '<span style="font-size:11px; color:rgba(255,255,255,.45);">Дополнительные материалы</span>'
      + '<span style="flex:1; height:1px; background:rgba(255,255,255,.1);"></span></div>'
      + '<div style="display:flex; flex-direction:column; gap:4px; margin-top:8px;">'
      + media.map((x) => {
        const key = r.id + '|' + x.kind;
        const pickable = x.vis === 'public' && x.alive;
        if (!pickable) {
          return '<div style="display:flex; align-items:center; gap:10px; width:100%; padding:9px 10px; border-radius:10px; background:rgba(217,164,65,.1); border:1px solid rgba(217,164,65,.3);">'
            + '<span style="flex:none; display:flex; color:#D9A441;">' + icon(WARN_ICON, 15) + '</span>'
            + '<span style="flex:1; min-width:0;"><span style="display:block; font-size:13px; color:#D9A441;">' + esc((MEDIA_META[x.kind] || {}).label || 'Материал') + '</span>'
            + '<span style="display:block; font-size:11px; color:rgba(255,255,255,.45); margin-top:1px;">' + (!x.alive ? 'ссылка недоступна — в сообщение не добавится' : 'внутренний материал — кандидату не отправляется') + '</span></span></div>';
        }
        const on = !!S.picks[key];
        return '<button type="button" class="hSoft" data-act="pickMedia" data-arg="' + attr(key) + '" style="display:flex; align-items:center; gap:10px; width:100%; padding:9px 10px; border:none; border-radius:10px; background:transparent; text-align:left; cursor:pointer; transition:.2s;">'
          + (on ? '<span style="flex:none; width:17px; height:17px; border-radius:5px; border:1px solid rgba(164,244,253,.55); background:rgba(164,244,253,.12); display:grid; place-items:center; color:#A4F4FD;">' + CHECK_ICON + '</span>'
            : '<span style="flex:none; width:17px; height:17px; border-radius:5px; border:1px solid rgba(148,180,230,.3);"></span>')
          + '<span style="flex:1; min-width:0;"><span style="display:block; font-size:13px; color:#E6F2FF;">' + esc((MEDIA_META[x.kind] || {}).label || 'Материал') + '</span>'
          + '<span style="display:block; font-size:11px; color:rgba(255,255,255,.4); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + esc(x.url) + '</span></span></button>';
      }).join('')
      + '</div></div>';
  }

  if (gen.removed.length) {
    inner += '<div style="margin-top:14px; padding:12px; border-radius:12px; background:rgba(217,164,65,.12); border:1px solid rgba(217,164,65,.30);">'
      + '<div style="font-size:12px; font-weight:600; color:#D9A441;">Вырезано стоп-словарём</div>'
      + '<div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;">'
      + gen.removed.map((t) => '<span style="height:24px; display:inline-flex; align-items:center; padding:0 9px; border-radius:9999px; background:rgba(217,164,65,.14); font-size:11.5px; color:#D9A441;">' + esc(t) + '</span>').join('')
      + '</div></div>';
  }

  inner += '<div style="display:flex; justify-content:flex-end; gap:8px; margin-top:20px;">'
    + '<button type="button" data-act="mClose" style="' + DLG_CANCEL + '">Закрыть</button>'
    + '<button type="button" class="hWhite" data-act="mCopy" style="height:34px; padding:0 16px; border:none; border-radius:9999px; background:#fff; color:#000; font-size:12px; font-weight:600; cursor:pointer; transition:.2s;">'
    + (S.copied ? 'Скопировано' : 'Скопировать с материалами') + '</button></div>';

  return overlay('Текст для кандидата', '560px', inner, 'mClose', true);
}

    + '</div></div>'
    + '<div style="margin-top:16px;"><div style="font-size:11.5px; color:rgba(255,255,255,.5); margin-bottom:7px;">Первая строка запроса · список позиций и вопросы подставляются автоматически</div>'
    + '<textarea rows="4" class="fLine" data-fid="cp:tpl" data-on="cp:tpl" style="width:100%; padding:12px 14px; border:1px solid rgba(255,255,255,.14); border-radius:14px; background:rgba(255,255,255,.04); color:#E6F2FF; font-size:12.5px; line-height:1.6; outline:none; resize:vertical; font-family:\'Inter\',system-ui,sans-serif;">' + esc(d.tpl || '') + '</textarea></div>'
    + '<div style="display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:14px; padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1);">'
    + '<span style="font-size:11.5px; color:rgba(255,255,255,.5);">Последняя доставка: ' + esc(d.delivery || '—') + '</span>'
    + '<span style="margin-left:auto; display:flex; flex-wrap:wrap; gap:6px;">'
    + '<button type="button" data-act="cpTest" style="' + SMALL_GHOST + '">Проверить подключение</button>'
    + '<button type="button" data-act="cpTestMsg" style="' + SMALL_PLAIN + '">Отправить тестовое</button></span></div>'
    + '<div style="display:flex; justify-content:flex-end; gap:8px; margin-top:20px;">'
    + '<button type="button" data-act="cpCancel" style="' + DLG_CANCEL + '">Отмена</button>'
    + '<button type="button" data-act="cpSave" style="height:34px; padding:0 18px; border:none; border-radius:9999px; background:#fff; color:#000; font-size:12px; font-weight:600; cursor:pointer;">Сохранить</button></div>';
  return overlay('Настройки контрагента', '560px', inner, 'cpCancel', true);
}

/* --------------------------- сохранение ставок ---------------------------- */

function rateNumber(value) { return Number(String(value == null ? '' : value).replace(/[^\d]/g, '')) || 0; }

function ratePayload() {
  const f = rateForm();
  const withTiers = f.strategy === 'shifts' || (f.strategy === 'clients' && f.tiersOn);
  return {
    source: f.source,
    strategy: f.strategy,
    amount: rateNumber(f.amount),
    tiers: withTiers
      ? f.tiers.filter((t) => String(t.amount).trim())
          .map((t) => ({ minShifts: rateNumber(t.shifts), amount: rateNumber(t.amount) }))
      : [],
    clients: f.clients,
    vacancy: f.vacancy || '',
    note: f.note || '',
    payout: f.payout || '',
    validFrom: f.from || '',
    validTo: f.to || ''
  };
}

/* dryRun считает, скольких позиций коснётся сетка, и ничего не пишет: ставку
   выставляют на весь контрагент разом, и «затронет 56 позиций» лучше увидеть
   до сохранения, а не после. */
function saveRates(dry) {
  const f = rateForm();
  if (f.busy) return;
  f.busy = true;
  fetch('/api/rates', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign(ratePayload(), { dryRun: !!dry }))
  })
    .then((res) => res.json().then((data) => ({ ok: res.ok, data: data })))
    .then((out) => {
      f.busy = false;
      if (!out.ok) { toast(out.data && out.data.detail ? out.data.detail : 'Не получилось сохранить'); return; }
      if (dry) { f.preview = 'затронет позиций: ' + out.data.positions + ' · правил: ' + out.data.rules; render(); return; }
      f.preview = '';
      toast('Сетка сохранена: правил ' + out.data.rules + ', позиций ' + out.data.positions);
      reloadData();
    })
    .catch((err) => { f.busy = false; toast('Не удалось сохранить: ' + (err && err.message ? err.message : err)); });
}

function deleteRate(id) {
  fetch('/api/rates/' + id, { method: 'DELETE', credentials: 'same-origin' })
    .then((res) => { if (!res.ok) throw new Error('HTTP ' + res.status); toast('Правило убрано'); reloadData(); })
    .catch((err) => toast('Не удалось убрать: ' + (err && err.message ? err.message : err)));
}

function reloadData() {
  fetch('/api/navigator', { credentials: 'same-origin' })
    .then((res) => res.json())
    .then((data) => { DATA = Object.assign(DATA, data); render(); })
    .catch(() => render());
}

/* ================================ действия ================================ */

const FILTER_KEYS = ['q', 'rateMin', 'ageCand', 'fRec', 'fHouse', 'fMeals', 'fCit', 'fGender', 'fMed', 'fSb', 'fSched', 'sort'];

function setFilter(patch) { _resetList = true; setState(patch); }

const ACTIONS = {
  goSearch: () => setState({ screen: 'search' }),
  goAdmin: () => openAdmin(),

  cityToggle: (name) => setFilter({ sel: S.sel.indexOf(name) >= 0 ? S.sel.filter((n) => n !== name) : S.sel.concat([name]) }),
  cityRemove: (name) => setFilter({ sel: S.sel.filter((n) => n !== name) }),
  cityClear: () => setFilter({ sel: [] }),
  toggleRadius: () => setFilter({ radius: S.radius ? 0 : 50 }),
  setRadius: (km) => setFilter({ radius: Number(km) }),
  toggleMore: () => setState({ moreOpen: !S.moreOpen }),
  resetFilters: () => setFilter({ rateMin: '', recPct: '', ageCand: '', fRec: '', fHouse: '', fMeals: '', fCit: '', fGender: '', fMed: '', fSb: '', fSched: '' }),
  setScope: (key) => setFilter({ scope: key }),

  openText: (id) => setState({ modal: id, copied: false }),
  openDetail: (id) => setState({ detail: id }),
  openGaps: (id) => setState({ gaps: id }),
  deadLink: (upd) => toast('Ссылка недоступна с ' + upd + ' — проверьте источник'),

  gClose: () => setState({ gaps: null }),
  gAsk: () => { setState({ gaps: null }); toast('Автоотправка не настроена — текст запроса собран во вкладке «Запросы»'); },
  dClose: () => setState({ detail: null }),
  dText: () => setState({ modal: S.detail, detail: null, copied: false }),
  mClose: () => setState({ modal: null, copied: false }),
  mCopy: () => {
    const r = rowById(S.modal);
    const gen = r ? candidateText(r, S.picks) : { text: '' };
    try { navigator.clipboard.writeText(gen.text); } catch (e) {}
    S.copied = true;
    toast('Текст скопирован — контрагент, объект и ставка рекрутера вырезаны');
  },
  pickMedia: (key) => {
    const next = Object.assign({}, S.picks);
    if (next[key]) delete next[key]; else next[key] = true;
    setState({ picks: next, copied: false });
  },


  setAdminTab: (key) => setState({ adminTab: key }),

  userRole: (key) => { S.userForm.role = key; render(); },
  hideIssued: () => setState({ issued: null }),
  copyIssued: () => {
    const node = document.getElementById('issuedPass');
    if (!node) return;
    const text = node.textContent || '';
    // Приложение отдаётся по http, где navigator.clipboard недоступен,
    // поэтому падаем на выделение текста — скопировать можно вручную.
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => toast('Пароль скопирован'),
        () => toast('Скопируйте вручную — буфер недоступен'));
    } else {
      const range = document.createRange();
      range.selectNodeContents(node);
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(range);
      toast('Выделено — скопируйте сочетанием клавиш');
    }
  },
  userCreate: () => {
    const f = S.userForm;
    if (!f.email.trim()) { toast('Укажите рабочую почту'); return; }
    userAction('/api/users', { email: f.email, name: f.name, role: f.role }, '');
    S.userForm = { email: '', name: '', role: f.role };
  },
  userReset: (id) => userAction('/api/users/' + id + '/reset', {}, ''),
  userToggle: (id) => userAction('/api/users/' + id + '/toggle', {}, 'Готово'),
  userSetRole: (arg) => {
    const parts = String(arg).split('|');
    userAction('/api/users/' + parts[0] + '/role', { role: parts[1] }, 'Роль изменена');
  },

  rateSource: (key) => { const f = rateForm(); f.source = key; f.clients = []; f.vacancy = ''; f.preview = ''; render(); },
  rateStrategy: (key) => { const f = rateForm(); f.strategy = key; f.preview = ''; render(); },
  rateTierAdd: () => { rateForm().tiers.push({ shifts: '', amount: '' }); render(); },
  rateTierDel: (index) => { rateForm().tiers.splice(Number(index), 1); render(); },
  rateTiersOn: () => { const f = rateForm(); f.tiersOn = !f.tiersOn; f.preview = ''; render(); },
  rateClient: (name) => {
    const f = rateForm();
    const at = f.clients.indexOf(name);
    if (at >= 0) f.clients.splice(at, 1); else f.clients.push(name);
    f.preview = '';
    render();
  },
  rateClientsAll: () => { rateForm().clients = rateSource().clients.map((c) => c.name); render(); },
  rateClientsNone: () => { rateForm().clients = []; render(); },
  ratePreview: () => saveRates(true),
  rateSave: () => saveRates(false),
  rateDelete: (id) => deleteRate(id),
  sendNow: () => toast(DATA.outreachEnabled
    ? 'Отправка запросов ещё не подключена в backend'
    : 'Отправка не настроена: в .env нет TELEGRAM_BOT_TOKEN'),

  excTake: (arg) => {
    const parts = String(arg).split(':');
    const e = computeExceptions()[Number(parts[0])];
    if (e && e.issue) resolve(e.issue, 'Выбрано значение', e.values[Number(parts[1])].v);
  },
  excMain: (index) => {
    const e = computeExceptions()[Number(index)];
    if (!e) return;
    if (e.source) { toast('Проверьте доступ к источнику ' + e.title); return; }
    toast(e.isDup ? 'Обе заявки: ' + e.id + ' и ' + (e.issue ? e.issue.dupWith : '') : 'Чат контрагента не подключён — уточните вручную');
  },
  excMerge: (index) => {
    const e = computeExceptions()[Number(index)];
    if (e && e.issue) resolve(e.issue, 'Объединено с ' + e.issue.dupWith, e.issue.dupWith);
  },
  excKeep: (index) => {
    const e = computeExceptions()[Number(index)];
    if (e && e.issue) resolve(e.issue, 'Отмечено как разные позиции', '');
  },
  excSnooze: () => toast('Отложено — вернётся при следующем прогоне'),

  outCopy: (index) => {
    const o = computeOutreach()[Number(index)];
    if (!o) return;
    try { navigator.clipboard.writeText(o.text); } catch (e) {}
    toast('Текст запроса скопирован — ' + o.cp);
  },
  outSend: () => toast('Отправка не настроена: в .env нет TELEGRAM_BOT_TOKEN'),

  cpMenu: (id) => setState({ cpMenu: S.cpMenu === id ? null : id }),
  cpEdit: (index) => {
    const cp = DATA.cps.filter((x) => !x.archived)[Number(index)];
    if (cp) setState({ cpMenu: null, cpEdit: Object.assign({}, cp, { required: (cp.required || []).slice() }) });
  },
  cpExclude: (index) => {
    const cp = DATA.cps.filter((x) => !x.archived)[Number(index)];
    if (!cp) return;
    cp.excluded = !cp.excluded;
    setState({ cpMenu: null });
    toast(cp.excluded
      ? cp.name + ' исключён из очереди запросов (до обновления страницы)'
      : cp.name + ' снова в работе');
  },
  cpAskDelete: (index) => {
    const cp = DATA.cps.filter((x) => !x.archived)[Number(index)];
    if (cp) setState({ cpMenu: null, cpDelete: cp, delPass: '', delErr: false });
  },
  cpRestore: (id) => {
    const cp = DATA.cps.find((x) => x.id === id);
    if (cp) { cp.archived = false; cp.excluded = false; setState({ cpMenu: null }); toast(cp.name + ' восстановлен из архива'); }
  },
  delCancel: () => setState({ cpDelete: null, delPass: '', delErr: false }),
  delConfirm: () => {
    /* Раньше здесь сверялся пароль администратора, лежавший в этом же файле.
       Пароля в браузере больше нет; сама операция и так закрыта ролью на
       сервере, а от случайного клика защищает ввод названия. */
    if (S.delPass.trim() !== S.cpDelete.name) { setState({ delErr: true }); return; }
    const cp = S.cpDelete;
    const linked = DATA.rows.some((r) => r.cp === cp.name);
    if (linked) { cp.archived = true; cp.excluded = true; toast('С контрагентом связаны заявки — перенесён в архив, связи сохранены'); }
    else { DATA.cps = DATA.cps.filter((x) => x.id !== cp.id); toast('Контрагент убран из списка (до обновления страницы)'); }
    setState({ cpDelete: null, delPass: '', delErr: false });
  },
  cpToggleReq: (key) => {
    const d = Object.assign({}, S.cpEdit);
    d.required = (d.required || []).indexOf(key) >= 0 ? d.required.filter((x) => x !== key) : (d.required || []).concat([key]);
    setState({ cpEdit: d });
  },
  cpCancel: () => setState({ cpEdit: null }),
  cpSave: () => { setState({ cpEdit: null }); toast('Настройки не сохранены: хранилище настроек контрагентов не подключено'); },
  cpTest: () => toast('Проверка подключения появится вместе с настройками контрагентов'),
  cpTestMsg: () => toast('Отправка не настроена: в .env нет TELEGRAM_BOT_TOKEN'),
  cpCheck: (index) => {
    const cp = DATA.cps.filter((x) => !x.archived)[Number(index)];
    toast('Приём данных идёт по расписанию ' + ((cp && cp.times) || '—') + ' · источник ' + ((cp && (cp.sources || []).join(', ')) || '—'));
  },
  cpTestMsgCard: () => toast('Отправка не настроена: в .env нет TELEGRAM_BOT_TOKEN'),
  ghSync: () => toast('Конфигурация источников живёт в коде — обновляется деплоем из ветки ' + GITHUB.branch),
  addSource: () => setState({
    cpEdit: {
      id: '', name: '', alias: '', kind: 'Telegram-чат', address: '', times: '12:00',
      required: Object.keys(DATA.required || {}), contact: '', bot: '', token: '', chat: '', thread: '',
      sendTime: SEND_TIME, tpl: DATA.template, delivery: 'ещё не отправлялось'
    }
  })
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset.arg, el); }
});

/* Текстовые поля перерисовывают список из сотни карточек, поэтому набор
   догоняется с небольшой задержкой: значение в состоянии обновляется сразу,
   перерисовка — когда пальцы остановились. */
const TYPED_KEYS = ['q', 'citySearch', 'rateMin', 'ageCand'];
let _typingTimer = null;

function onFieldChange(el) {
  const key = el.dataset.on;
  if (!key) return;
  const value = el.value;
  if (key.indexOf('rate:') === 0) {
    const f = rateForm();
    const parts = key.split(':');           // rate:amount либо rate:tier:0:shifts
    if (parts[1] === 'tier') {
      const tier = f.tiers[Number(parts[2])];
      if (tier) tier[parts[3]] = value;
    } else {
      f[parts[1]] = value;
    }
    f.preview = '';
    // Выпадашка меняет форму (список должностей), текстовые поля — нет:
    // перерисовывать сетку на каждый символ незачем.
    if (el.tagName === 'SELECT') render();
    return;
  }
  if (key.indexOf('user:') === 0) {
    // Как и у редактора контрагента: на каждый символ не перерисовываем,
    // иначе поле теряет фокус посреди набора почты.
    S.userForm[key.slice(5)] = value;
    return;
  }
  if (key.indexOf('cp:') === 0) {
    const d = Object.assign({}, S.cpEdit);
    d[key.slice(3)] = value;
    S.cpEdit = d;
    return;                       // редактор контрагента не перерисовываем на каждый символ
  }
  if (key === 'delPass') { setState({ delPass: value, delErr: false }); return; }
  if (TYPED_KEYS.indexOf(key) >= 0) {
    S[key] = value;
    if (_typingTimer) clearTimeout(_typingTimer);
    _typingTimer = setTimeout(() => { _resetList = true; render(); }, 140);
    return;
  }
  const patch = {}; patch[key] = value;
  if (FILTER_KEYS.indexOf(key) >= 0) setFilter(patch); else setState(patch);
}

document.addEventListener('input', (e) => {
  if (e.target.dataset && e.target.dataset.on && e.target.tagName !== 'SELECT') onFieldChange(e.target);
});
document.addEventListener('change', (e) => {
  if (e.target.dataset && e.target.dataset.on && e.target.tagName === 'SELECT') onFieldChange(e.target);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) {
    const fn = ACTIONS[e.target.dataset.enter];
    if (fn) fn();
    return;
  }
  if (e.key !== 'Escape') return;
  if (S.cpDelete) setState({ cpDelete: null, delPass: '', delErr: false });
  else if (S.cpMenu) setState({ cpMenu: null });
  else if (S.cpEdit) setState({ cpEdit: null });
  else if (S.modal) setState({ modal: null, copied: false });
  else if (S.gaps) setState({ gaps: null });
  else if (S.detail) setState({ detail: null });
});

/* ================================= загрузка ================================= */

fetch('/api/navigator', { credentials: 'same-origin' })
  .then((res) => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
  .then((data) => {
    DATA = Object.assign(DATA, data);
    S.loading = false;
    if (PROPS.radiusDefault) S.radius = PROPS.radiusDefault;
    render();
  })
  .catch((err) => { S.loading = false; S.error = String(err && err.message ? err.message : err); render(); });

render();
</script>
